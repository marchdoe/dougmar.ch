    description: "OWN GOLD STANDARD (2026-04-28, risk 8): drenched terracotta Specimen — a single hue committed across ~70% of the viewport, type waterfall reversed out of the field, labels and size markers treated as design material. Rated the benchmark: committed gestures, not hedges."
    tags:
      composition: specimen
      mood: warm
      density: moderate
  - file: own-2026-06-13-fairway-split.png
    tier: floor
    description: "FLOOR (2026-06-13): Split as argument on a teal-on-near-black field. Left half is the thesis, the Tolkien quote with ADVENTURE at about 136px in condensed Big Shoulders caps and the rest of the line smaller around it. Right half is the evidence, a featured project card above hairline-ruled rows of selected work and experiments. The two halves need each other."
    tags:
      composition: split
      mood: energetic
      density: moderate

  # --- External references ---
  - url: https://davidrudnick.org
    description: "Poster logic taken literally: the page IS a typographic poster. One statement at viewport scale, type as image, zero supporting UI above the fold. The confidence comes from what is withheld."
    tags:
      composition: poster
      mood: dramatic
      density: sparse
  - url: https://studiodumbar.com
    description: "Studio Dumbar / DEMO energy: aggressive grotesk at full bleed, one accent color pushed to full saturation, rhythm from repetition of a single bold move rather than variety of small ones."
    tags:
      composition: poster
      mood: energetic
      density: moderate
  - url: https://klim.co.nz
    description: "Klim type specimens: a waterfall of the same face doing different jobs — display cut at 120px above dense text settings, with size labels, foundry numbers, and hairline rules doing the layout work. Dense but never messy because every element sits on the same strict grid."
    tags:
      composition: specimen
      mood: serious
      density: dense
  - url: https://pangrampangram.com
    description: "Pangram Pangram specimen pages: single-hue drenched field, type reversed out, weight changes (thin → black) used as the page's rhythm instead of imagery. Proof that a specimen can feel warm, not clinical."
    tags:
      composition: specimen
      mood: warm
      density: moderate
  - url: https://www.nytimes.com
    description: "Broadsheet discipline: hierarchy built from size ratios, decks, and kickers — not color. Hairline rules separate; small caps label; the reader always knows what matters most. Steal the ratio system (roughly 6:3:1 between hed, deck, body), not the look."
    tags:
      composition: broadsheet
      mood: serious
      density: dense
  - url: https://ok-rm.co.uk
    description: "Gallery restraint: images breathe inside generous whitespace, captions in one strict small-caps system, no decorative moves at all. Whitespace reads as luxury when the few elements present are impeccably aligned."
    tags:
      composition: gallery
      mood: calm
      density: sparse
  - url: https://frankchimero.com
    description: "Scroll as essay: one reading column, type at genuine reading sizes with generous leading, hierarchy from spacing rather than scale jumps. Restraint as confidence — nothing shouts, everything is considered."
    tags:
      composition: scroll
      mood: calm
      density: moderate
  - url: https://cargo.site
    description: "Stack of self-contained color fields: each section is its own poster with its own background commitment, so scrolling reads like flipping a deck. Works when each panel makes ONE move; fails when panels hedge."
    tags:
      composition: stack
      mood: playful
      density: moderate
  - url: https://www.experimentaljetset.nl
    description: "Index as interface: the entire archive is a typographic list — one row per project, no thumbnails, typography and numbering do all the work. Dense, fast, and confident; the anti-gallery."
    tags:
      composition: index
      mood: minimal
      density: dense
