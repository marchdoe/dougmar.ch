# Curated Design Reference Library
# Add screenshots to this directory and index them here.
# Entries are TEXT-ONLY as far as the models are concerned — the description
# carries the entire taste signal, so write the concrete design move, not vibes.
# The one exception is `tier`: tiered entries are also sent as images by the
# later pipeline stages (loaded by scripts/utils/reference-tiers.js), and are
# never dropped by the library cap or by brief scoring. Nothing else is ever
# sent as an image.
#   tier: floor — Doug's minimum bar. Every night must be at least this good.
#   tier: gold  — aspirational. Empty until Doug names one.
#
# Tags:
#   composition: poster | broadsheet | gallery | scroll | split | stack | specimen | index
#   mood: warm | cold | energetic | calm | dramatic | minimal | playful | serious
#   density: sparse | moderate | dense

references:
  # --- Own archive references (from recorded ratings) ---
