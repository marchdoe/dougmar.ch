# pnpm 12 records its own version in a first YAML document at the top of
# pnpm-lock.yaml. GitHub's dependency graph reads only that first document, so
# from 2026-09-12 it saw pnpm and none of our packages: no Dependabot alerts, no
# version updates. `ignore` keeps the lockfile one document. CI still installs
# the exact version in package.json's packageManager through pnpm/action-setup.
pmOnFail: ignore

allowBuilds:
  esbuild: true
  lightningcss: true
  # Native watcher pulled in transitively. Its build script was never run under
  # the previous onlyBuiltDependencies allowlist and nothing depends on it, so
  # keep it blocked.
  '@parcel/watcher': false

# Security overrides.
#
# Scoped with pnpm's `name@range` selector so each rule only rewrites the
# versions that are actually vulnerable, leaving other majors in the tree
# untouched. Re-derive with `pnpm audit` after dependency bumps and delete
# entries that upstream has fixed — every rule here should map to a live
# advisory.
#
# The esbuild and h3 rules were dropped once nothing in the tree resolved
# below their floors. Do not drop this one on the same reasoning: postcss
# reads as 8.5.26 only because this rule puts it there. Remove the line and
# it falls back to 8.5.14, and `pnpm audit` reports one high and one moderate.
overrides:
  'postcss@<8.5.23': '>=8.5.23'
  # @pandacss/core 1.12.0 pins both of these exactly, so nothing resolves past
  # them without a rule. Dependabot #390 (browserslist, high), #389
  # (postcss-selector-parser, low) and GHSA-rj75-hqrm-r3gf (same package, moderate). Drop each once a Panda release moves on.
  'browserslist@<4.28.7': '>=4.28.7'
  'postcss-selector-parser@>=7.0.0 <7.1.6': '>=7.1.6'
  # js-yaml sits under @tanstack/start-plugin-core > xmlbuilder2 (build time
  # only, no outside YAML). The site's own js-yaml is ^5.3.0 and is untouched.
  # GHSA-2883-xcg3-v3hh, high. Drop once xmlbuilder2 resolves 4.3.2 on its own.
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  # Both sit under @pandacss/dev 1.12's build-time tree (reporter > table > ajv,
  # and parser > ts-morph > minimatch). GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g,
  # GHSA-hrr3-gc8f-f4qj, GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h,
  # GHSA-wjr9-j795-jxcr, GHSA-333x-w4r6-6crp (fast-uri); GHSA-6j4f-fj2g-mc7p,
  # GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr (brace-expansion);
  # GHSA-g3hv-75wg-m249 (minimatch). Drop once Panda moves (v2 is out).
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'minimatch@<11.0.1': '^11.0.1'
