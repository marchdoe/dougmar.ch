name: Daily Redesign

on:
  schedule:
    # 00:15 America/New_York, year-round. The site is a new design every day,
    # and a quarter past midnight is the earliest moment that is unambiguously
    # the new day; it also leaves five to six hours before anyone is likely to
    # look, so a scheduler that delivers late still lands before morning.
    #
    # GitHub cron is UTC-only with no DST support, so one entry cannot track a
    # local time across the switch: a fixed '15 5 * * *' is 00:15 in EST but
    # 01:15 in EDT. Both entries below fire every day and the `guard` job drops
    # whichever one is an hour wrong for the current offset, so exactly one
    # survives per day in either season.
    #
    # These are the trigger times, not the start times. Scheduled workflows
    # queue behind everything else on the hour, and after the 2026-08-26
    # Actions outage this repo's triggers arrived 5-11 hours late or not at
    # all (#193). Moving the trigger to just after midnight is the budget for
    # that: a run that starts hours late is still a morning design. The :15
    # keeps it off the top of the hour, which GitHub's own docs say to avoid.
    - cron: '15 4 * * *' # 00:15 EDT (skipped in winter — 23:15 EST the day before)
    - cron: '15 5 * * *' # 00:15 EST (skipped in summer — 01:15 EDT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — generate and verify build but do not commit'
        type: boolean
        default: false

# Prevent overlapping runs (cron + manual trigger) that would race on
# git push to main. Queue instead of cancelling — we never want to
# abort a successful run mid-commit.
concurrency:
  group: daily-redesign
  cancel-in-progress: false

jobs:
  # Which of the two cron entries is correct depends on whether New York is
  # currently on EDT or EST, and GitHub expressions have no timezone functions
  # to decide it. So a tiny job decides, and `redesign` waits on its answer.
  # A manual run is never dropped.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "manual trigger (${{ github.event_name }}) — always runs"
            exit 0
          fi
          # Decide from WHICH cron entry fired, not from the clock when the job
          # finally starts. Reading the arrival hour meant any queue lag past
          # :59 pushed the run into hour 5, so the EDT entry was dropped as
          # "the other one" and the EST entry an hour later was dropped too —
          # the day silently produced no build. The comment at the top of this
          # file documents 17-31 minutes of routine lag, so that was reachable
          # on an ordinary night, not just a bad one.
          #
          # The season, unlike the arrival time, is stable: `date +%Z` is EDT
          # or EST for the whole run. Pair it with the entry that fired and
          # exactly one of the two survives per day.
          sched='${{ github.event.schedule }}'
          zone=$(TZ=America/New_York date +%Z)
          local_now=$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')
          case "$sched|$zone" in
            '15 4 * * *|EDT' | '15 5 * * *|EST')
              echo 'run=true' >> "$GITHUB_OUTPUT"
              echo "$local_now — cron '$sched' is the $zone entry, this is the day's run"
              ;;
            '15 4 * * *|EST' | '15 5 * * *|EDT')
              echo 'run=false' >> "$GITHUB_OUTPUT"
              echo "$local_now — cron '$sched' is the other DST entry for $zone; skipping"
              ;;
            *)
              # An unrecognised entry means the schedule was edited without
              # updating this case. Build anyway: a missed morning is visible
              # on a site whose whole claim is that it rebuilds every morning,
              # and the concurrency group queues a duplicate rather than
              # racing it.
              echo 'run=true' >> "$GITHUB_OUTPUT"
              echo "::warning::unrecognised schedule '$sched' in $zone — running rather than risk a missed day"
              ;;
          esac

  # Two jobs where there was one (#337). The agents job runs model-authored
  # code — `pnpm build` executes the TSX the React Engineer wrote from
  # inputs that include public, attacker-writable text (HN titles, NewsAPI
  # headlines, RSS descriptions) — and it used to do so with the deploy key
  # already in its git config, because `ssh-key` checkout ran first and
  # persist-credentials defaults to true. sanitize-signal.js and the build
  # validator are real defenses, but they are pattern matchers standing
  # between a public feed and a credential that can write to main.
  #
  # Now nothing that runs generated code can reach the key. The agents job
  # checks out with no credential at all, stages exactly what the push step
  # used to stage, and hands it over as one binary patch. The publish job
  # checks out with the key, applies the patch, and pushes.
  redesign:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80  # mockup revision rounds add ~10-15m each; 45m could not absorb one
    permissions:
      contents: read
      issues: write  # collect-ratings.js closes the harvested rating issue
    outputs:
      date: ${{ steps.redesign.outputs.date }}
    env:
      # Bound the pipeline's own deadline below the job timeout above, so the
      # run ships what it has instead of being killed mid-call with no trace.
      # design-agents.js reads this and clamps every model call to what is
      # left of it (scripts/utils/run-budget.js).
      RUN_BUDGET_MINUTES: '60'
      # Creative weights come from repo variables so the owner panel can
      # adjust them (PUT /api/panel/weights → GitHub Actions variables).
      # Fallbacks preserve the pre-panel defaults.
      # Uses empty-check idiom so a weight of 0 survives set variable values.
      WEIGHT_SIGNALS: ${{ vars.WEIGHT_SIGNALS == '' && '5' || vars.WEIGHT_SIGNALS }}
      WEIGHT_INSPIRATION: ${{ vars.WEIGHT_INSPIRATION == '' && '5' || vars.WEIGHT_INSPIRATION }}
      WEIGHT_RATINGS: ${{ vars.WEIGHT_RATINGS == '' && '5' || vars.WEIGHT_RATINGS }}
      # No constant fallback (was '8', 2026-04-28 iter-3 finding). '' flows
      # through as absent — design-agents.js derives risk 3-10 from the
      # build date when WEIGHT_RISK is unset, instead of a fixed value that
      # produced the same "BOLD" prompt sentence every day. A set repo var
      # still wins: the left branch of the idiom only fires when
      # vars.WEIGHT_RISK IS the empty string (i.e. genuinely unset), same
      # short-circuit shape as the other three lines above.
      WEIGHT_RISK: ${{ vars.WEIGHT_RISK == '' && '' || vars.WEIGHT_RISK }}

    steps:
      # No credential of any kind in this job's git config: the deploy key
      # lives in `publish`, and GITHUB_TOKEN is not persisted either. The
      # harvest step below is handed the token explicitly for the issues API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        # --frozen-lockfile because this job pushes to main. Without it a
        # resolution drift rewrites pnpm-lock.yaml and rides along in the
        # nightly's commit, changing dependencies in a commit whose message
        # says it changed a design. ci.yml and vercel.json both use the flag.
        run: pnpm install --frozen-lockfile

      # Keyed on the resolved @playwright/test version: browser builds are tied
      # to it, so a cache hit on a stale key would install browsers the runner
      # cannot drive. jq reads the version pnpm actually resolved rather than
      # the range in package.json.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm ls @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        # The pipeline renders screenshots with Playwright/Chromium: the OG
        # share card (public/og/<date>.png), the screenshot-critic vision
        # gate, and the archive site snapshots. pnpm does not run Playwright's
        # browser-download postinstall (not in allowBuilds), so without this
        # every chromium.launch() throws and the callers silently skip —
        # leaving og:image a 404 and the screenshot critic a no-op in CI.
        # The cache above skips the download on a hit; --with-deps still
        # installs the OS packages either way (#346).
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Claude CLI
        # Pinned to 2.1.207. The old 2.1.92 pin (0KB-output regression in
        # 2.1.94+, PR #40) sent the legacy thinking.type=enabled param, which
        # claude-opus-4-8 rejects with a 400 — this broke every scheduled run
        # after the explicit-model-ID change (066e703) merged. Current CLIs
        # send adaptive thinking. Verify bumps with a workflow_dispatch dry run.
        run: npm install -g @anthropic-ai/claude-code@2.1.207

      - name: Harvest ratings from GitHub issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-ratings.js

      - name: Collect signals
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          PRODUCT_HUNT_CLIENT_ID: ${{ secrets.PRODUCT_HUNT_CLIENT_ID }}
          PRODUCT_HUNT_CLIENT_SECRET: ${{ secrets.PRODUCT_HUNT_CLIENT_SECRET }}
        run: node scripts/collect-signals.js

      - name: Collect references
        # Curated library (references/index.yml) + trending signals from the
        # step above, written to signals/today.references.md for the Art
        # Director. Reads only local files (no network calls of its own) and
        # never exits non-zero — provider/parse failures are caught and
        # logged internally, same non-blocking contract as collect-signals.js.
        run: node scripts/collect-references.js

      - name: Run daily redesign
        id: redesign
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        # Writes `date=<YYYY-MM-DD>` to GITHUB_OUTPUT: the day the run is FOR,
        # which is signals.date, the Eastern day every archive path is keyed
        # on. The steps below read it rather than deriving their own.
        run: node scripts/daily-redesign.js

      - name: Stage the night's output
        if: ${{ !inputs.dry_run }}
        env:
          RUN_DATE: ${{ steps.redesign.outputs.date }}
        run: |
          # `date -u` here disagreed with the pipeline's Eastern day every
          # evening, so a /panel-triggered run after 20:00 staged the site and
          # none of the day's archive record (#338). The pipeline's own answer
          # comes first; the fallback is the same clock it uses.
          TODAY="${RUN_DATE:-$(TZ=America/New_York date +%Y-%m-%d)}"
          # Stage only today's completed build — explicitly exclude
          # build-pre-* (snapshot temp dirs) and build-failed-* (failure
          # diagnostic dirs) so they never leak into main. Uses explicit
          # paths instead of archive/ so other dates' dirs aren't touched.
          git add "archive/$TODAY/archetype.txt" 2>/dev/null || true
          git add "archive/$TODAY/brief.md" 2>/dev/null || true
          # record.json is the day's canonical record (#153). Without it the
          # projection falls back to rebuilding the record from brief.md and
          # the build dir on every build — which works, and is the designed
          # fallback, but means the cache never persists.
          git add "archive/$TODAY/record.json" 2>/dev/null || true
          # Only stage numeric timestamp build dirs (build-\d+), not build-pre-* or build-failed-*
          for d in archive/$TODAY/build-[0-9]*; do
            [ -d "$d" ] && git add "$d"
          done
          git add archive/*/rating-*.json 2>/dev/null || true
          # Add each output path independently — some are absent on a given
          # run (public/og/ only exists once OG generation works in CI), and
          # under bash -e one unmatched pathspec would abort the whole push.
          # public/archive-data/ carries the day's screenshot and viewport
          # captures. It was added when #154 moved them out of the preserved
          # namespace — public/archive/<date>.png became
          # public/archive-data/<date>.png — and this list was not updated with
          # it, so screenshots stopped being committed at all. The JSON beside
          # them is gitignored and generated at build time, so adding the whole
          # directory stages only the images.
          # app/routeTree.gen.ts is regenerated by the nightly's build and must
          # ship with any route file it adds or removes, otherwise tsc on main
          # checks a stale tree (#411).
          for p in elements/ app/components/ app/routes/ app/routeTree.gen.ts public/archive/ public/archive-data/ public/og/ references/ signals/today.references.md; do
            git add "$p" 2>/dev/null || true
          done
          # One patch, binary-safe, carrying exactly the staged set. The
          # publish job applies it to a clean checkout that has the key.
          git diff --cached --binary > "$RUNNER_TEMP/nightly.patch"
          echo "staged $(git diff --cached --name-only | wc -l | tr -d ' ') path(s), $(wc -c < "$RUNNER_TEMP/nightly.patch" | tr -d ' ') bytes"

      - name: Upload the night's output
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly.patch
          retention-days: 7
          if-no-files-found: error

      # The failure diagnostics never survived the runner. `Push changes`
      # deliberately keeps build-failed-* out of main — they are diagnostics,
      # not history — and nothing else collected them, so every failure notice
      # since the workflow was written has pointed at a path that does not
      # exist. Thirty days is long enough to debug a bad night and short
      # enough that failed builds do not accumulate.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failed-${{ github.run_id }}
          path: |
            archive/*/build-failed-*/
            archive/*/build-failed-sources-*/
            archive/*/last-build-output.txt
            archive/*/last-static-checks.txt
          retention-days: 30
          if-no-files-found: ignore


  publish:
    needs: redesign
    if: ${{ needs.redesign.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # the push goes over SSH with the deploy key, not the token
      issues: write   # the rating issue
    steps:
      # Checks out over SSH with a deploy key rather than GITHUB_TOKEN.
      #
      # The `biome-gate` ruleset requires Lint and Typecheck on the default
      # branch, and this job pushes to main directly. github-actions[bot] is
      # not in the ruleset's bypass list and cannot be added: GitHub does not
      # offer it as a bypass actor on a personal-account repository, only
      # Copilot's apps appear under Apps. Deploy keys are offered, and are
      # scoped to this repository rather than carrying a person's identity.
      #
      # Opening a PR and auto-merging is not an alternative. A pull request
      # created with GITHUB_TOKEN deliberately does not trigger workflow runs,
      # so the required checks would never start and the merge would wait on
      # checks that cannot run.
      #
      # `ssh-key` makes actions/checkout set the remote to SSH, so the push
      # step below needs no change. No generated code runs in this job: it
      # applies a patch and pushes.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/download-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Push changes
        env:
          RUN_DATE: ${{ needs.redesign.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY="${RUN_DATE:-$(TZ=America/New_York date +%Y-%m-%d)}"
          # An empty patch is a night that changed nothing; not an error.
          if [ -s "$RUNNER_TEMP/nightly.patch" ]; then
            git apply --index --binary "$RUNNER_TEMP/nightly.patch"
          fi
          git diff --cached --quiet || git commit -m "chore: daily redesign $TODAY"
          # Retry push up to 3 times in case of concurrent pushes to main.
          # --autostash: the pipeline leaves runner-local modifications to
          # tracked files (e.g. regenerated styled-system codegen) that
          # otherwise make `pull --rebase` refuse to run.
          # A conflicted rebase leaves a rebase-merge directory behind; the next
          # attempt must clear it first or it fails on that alone, not a retry (#342).
          pushed=false
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push origin main; then
              pushed=true
              break
            fi
            echo "push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          # Fail loudly — a for-loop's exit status is its last command (sleep),
          # which once let a run report success while the commit never left
          # the runner.
          if [ "$pushed" != "true" ]; then
            echo "::error::push failed after 3 attempts — daily commit not on main"
            exit 1
          fi

      - name: Read needs-a-human findings
        # Run right after `Push changes`: that step's commit is what puts
        # archive/$TODAY/build-*/verdicts.json on this runner in the first
        # place, so this cannot run any earlier in the job. A standalone
        # script rather than inline github-script JS — the repo is ESM and
        # github-script's sandbox is CommonJS, so the section-building logic
        # lives in scripts/utils/needs-human.js instead, where it is unit
        # tested (#468).
        id: needs_human
        env:
          RUN_DATE: ${{ needs.redesign.outputs.date }}
        run: |
          TODAY="${RUN_DATE:-$(TZ=America/New_York date +%Y-%m-%d)}"
          node scripts/print-needs-human-section.js "$TODAY" > "$RUNNER_TEMP/needs-human.md"
          echo "wrote $(wc -c < "$RUNNER_TEMP/needs-human.md" | tr -d ' ') byte(s)"

      - name: Read shipped-with-faults findings
        # Same shape as the step above, for the SHIPPED-WITH-FAULTS entry a
        # final REVISE after a repair round writes (#467).
        id: shipped_with_faults
        env:
          RUN_DATE: ${{ needs.redesign.outputs.date }}
        run: |
          TODAY="${RUN_DATE:-$(TZ=America/New_York date +%Y-%m-%d)}"
          node scripts/print-shipped-with-faults-section.js "$TODAY" > "$RUNNER_TEMP/shipped-with-faults.md"
          echo "wrote $(wc -c < "$RUNNER_TEMP/shipped-with-faults.md" | tr -d ' ') byte(s)"

      - name: Open today's rating issue
        uses: actions/github-script@v7
        env:
          RUN_DATE: ${{ needs.redesign.outputs.date }}
        with:
          script: |
            const fs = require('fs')
            // The day the run was for (see the redesign step), not UTC now.
            const today =
              process.env.RUN_DATE ||
              new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' })
            let brief = ''
            try {
              const briefMd = fs.readFileSync(`archive/${today}/brief.md`, 'utf8')
              brief = briefMd.match(/\*\*Design Brief:\*\*\s*(.+)/)?.[1] || ''
            } catch {}
            const hero = brief.slice(0, 60) || today
            // public/archive-data/, not public/archive/ — #154 moved the day's
            // screenshot and this URL was not moved with it, so every rating
            // issue since has shown a broken image.
            const img = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/public/archive-data/${today}.png`
            // Same archiver run, the mobile viewport capture — see #466. The
            // owner grades the phone from this, not just the 1440 shot above.
            const mobileImg = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/public/archive-data/${today}/viewports/mobile.png`
            // Written by the previous step from verdicts.json — see #468.
            // Empty when nothing needs a human, which leaves the body below
            // unchanged.
            let needsHuman = ''
            try {
              needsHuman = fs.readFileSync(process.env.RUNNER_TEMP + '/needs-human.md', 'utf8').trim()
            } catch {}
            // Written by the previous step from verdicts.json — see #467.
            // Empty when the build shipped clean, which leaves the body
            // below unchanged.
            let shippedWithFaults = ''
            try {
              shippedWithFaults = fs
                .readFileSync(process.env.RUNNER_TEMP + '/shipped-with-faults.md', 'utf8')
                .trim()
            } catch {}
            const body = [
              `![today's design](${img})`,
              ``,
              `<img src="${mobileImg}" width="270" alt="today's design at phone width"><br>First fold at 360.`,
              ``,
              brief ? `> ${brief}` : '',
              ``,
              `Live: https://dougmar.ch · [Archive entry](https://dougmar.ch/archive/${today})`,
              ``,
              `Rate it (edit the YAML in a reply, ~2 min):`,
              '```yaml',
              'grade: B        # A-D',
              'worked: ""',
              `didnt: ""`,
              'try: ""',
              '```',
              ...(needsHuman ? ['', needsHuman] : []),
              ...(shippedWithFaults ? ['', shippedWithFaults] : []),
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rate: ${today} — "${hero}"`,
              body,
              labels: ['daily-rating'],
            })

  # One notification for either job. `failure()` inside a job only sees that
  # job, so a push that failed after the agents succeeded used to be silent.
  notify:
    needs: [redesign, publish]
    if: ${{ always() && (needs.redesign.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify on failure
        uses: actions/github-script@v7
        with:
          script: |
            // The run may have died before it published its date; the
            // Eastern calendar day is the same clock the pipeline keys on.
            const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' })
            const title = `Daily redesign failed — ${today}`
            const body = [
              `The daily redesign pipeline failed.`,
              ``,
              `**Run:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Trigger:** ${context.eventName}`,
              `**Failed job:** ${'${{ needs.redesign.result }}' === 'failure' ? 'redesign (the agents)' : 'publish (the push)'}`,
              `**Commit:** ${context.sha.slice(0, 7)}`,
              ``,
              `The trace, the failing sources and the full build output are attached to that run as the \`build-failed-${context.runId}\` artifact (kept 30 days). Download it and start at \`trace.json\`; the run log has the same story in line order.`,
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['pipeline-failure'],
            })
