name: CI

on:
  pull_request:
    branches: [main]
  # The nightly pushes to main over a deploy key with no PR, so this push
  # trigger is the first time the full suite sees a nightly commit — a red
  # check on main is the signal for now, not a gate (#339).
  push:
    branches: [main]

# A new push to the same PR makes the run in flight worthless. Both other
# workflows already do this.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job in this workflow uses the token, and branch code — including on a
# main-based PR — runs here, some of it LLM-written (#341).
permissions:
  contents: read

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint & format check (Biome)
        run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Keyed on the resolved @playwright/test version: browser builds are tied
      # to it, so a cache hit on a stale key would install browsers the runner
      # cannot drive. jq reads the version pnpm actually resolved rather than
      # the range in package.json.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm ls @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Must run before unit tests — the responsive-scorer + viewport-screenshotter
      # vitest suites launch real Chromium for accurate DOM measurements.
      # --with-deps installs OS packages, which the cache does not cover, so it
      # runs either way; only the browser download is skipped on a hit.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # With coverage, so the floor in vitest.config.ts is enforced. The
      # nightly's own gate stays `pnpm test`.
      - name: Run unit tests
        run: pnpm test:coverage

      - name: Build site
        run: pnpm build

      # playwright.config.ts starts `vite preview` itself via webServer and
      # waits for the port to answer. This step used to background the server
      # and sleep 5, which passed or failed on how busy the runner was.
      - name: Run E2E tests (site health)
        run: pnpm test:e2e:site

  architecture:
    name: Architecture (fallow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `audit --base` diffs against the merge base, so the shallow default
      # checkout is not enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Blocking as of #216: the inherited dead code this was waiting on is
      # gone, and `audit --base` scopes findings to what the PR changed, so a
      # failure here is something this branch introduced.
      - name: Architecture audit (fallow)
        # On a pull_request, base_ref is the target branch. On a push (the
        # nightly landing on main with no PR), base_ref is empty; audit the
        # pushed range against the previous main SHA instead (#339).
        run: pnpm fallow audit --base ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}

  dev-panel:
    name: Dev panel (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm ls @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The panel reads signals/today.yml. /api/dev-data would collect it on
      # the first request, but that races the first test against a 15s spawn;
      # collecting up front makes the run deterministic. Providers without a
      # key are skipped, the date-derived ones always succeed, and the file is
      # written either way.
      - name: Collect signals
        run: node scripts/collect-signals.js

      # E2E_DEV=1 brings the dev-panel project and its `vite dev` webServer
      # into the Playwright config, which otherwise leaves both out under CI.
      - name: Run E2E tests (dev panel)
        run: E2E_DEV=1 pnpm test:e2e:dev
