version: 2

updates:
  # Every action is pinned to a commit SHA with its tag in a trailing comment
  # (#544). A SHA never moves on its own, so this is what keeps the pins
  # current: one PR a week for all of them, with the comment updated too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Version updates only. Security updates are a separate switch in the repo
  # settings and keep opening their own PRs. Minor and patch releases arrive as
  # one PR a week; a major release gets a PR of its own so it can be read alone.
  #
  # The `overrides` in pnpm-workspace.yaml are security floors, not pins, so a
  # version bump does not fight them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
