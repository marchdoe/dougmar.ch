    const name = e => `${e.s.label}→${e.t.label}`;
    const crossing = ([a, b], [c, d]) => {
      const av = a[0] === b[0], cv = c[0] === d[0];
      if (av === cv) { // parallel: overlapping collinear run = shared trunk
        if (av && Math.abs(a[0] - c[0]) < 1) return Math.min(Math.max(a[1], b[1]), Math.max(c[1], d[1])) - Math.max(Math.min(a[1], b[1]), Math.min(c[1], d[1])) > 1 ? 'share' : null;
        if (!av && Math.abs(a[1] - c[1]) < 1) return Math.min(Math.max(a[0], b[0]), Math.max(c[0], d[0])) - Math.max(Math.min(a[0], b[0]), Math.min(c[0], d[0])) > 1 ? 'share' : null;
        return null;
      }
      const [v, hz] = av ? [[a, b], [c, d]] : [[c, d], [a, b]];
      const x = v[0][0], y = hz[0][1];
      const inV = y > Math.min(v[0][1], v[1][1]) + .5 && y < Math.max(v[0][1], v[1][1]) - .5, inH = x > Math.min(hz[0][0], hz[1][0]) + .5 && x < Math.max(hz[0][0], hz[1][0]) - .5;
      return inV && inH ? 'cross' : null;
    };
    for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
      if (geo.edges[i].fixed && geo.edges[j].fixed) continue; // one comb: its branches share the trunk by design
      let found = null;
      for (const s1 of segs[i]) { for (const s2 of segs[j]) { found = crossing(s1, s2); if (found) break; } if (found) break; }
      if (found === 'cross') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} cross`);
      if (found === 'share') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} share a line`);
    }
    geo.edges.forEach((e, i) => { if (!e.lbl) return; const L = { x: e.lbl.x + 1, y: e.lbl.y + 1, w: e.lbl.w - 2, h: e.lbl.h - 2 };
      geo.edges.forEach((o, j) => { if (j !== i && segs[j].some(([a, b]) => Math.max(a[0], b[0]) > L.x && Math.min(a[0], b[0]) < L.x + L.w && Math.max(a[1], b[1]) > L.y && Math.min(a[1], b[1]) < L.y + L.h)) issues.push(`${where}: label "${e.lbl.text || e.lbl.step}" lies on edge ${name(o)}`); }); });
    const segHit = (r, i) => segs[i].some(([a, b]) => Math.max(a[0], b[0]) > r.x && Math.min(a[0], b[0]) < r.x + r.w && Math.max(a[1], b[1]) > r.y && Math.min(a[1], b[1]) < r.y + r.h);
    if (geo.map) {
      const ex = 12;
      geo.edges.forEach((e, i) => {
        // clearance: a route keeps 12+ px from every node it does not connect
        geo.nodes.forEach(n => { if (n.id === e.from || n.id === e.to) return;
          if (segHit({ x: n.x - ex + .5, y: n.y - ex + .5, w: n.w + 2 * ex - 1, h: n.h + 2 * ex - 1 }, i)) issues.push(`${where}: edge ${name(e)} passes within ${ex}px of node "${n.label}"`); });
        // no detours: a route stays under 2.5x the straight distance between its ends
        const len = e.pts.slice(1).reduce((a, p, k) => a + Math.abs(p[0] - e.pts[k][0]) + Math.abs(p[1] - e.pts[k][1]), 0);
        const d = Math.hypot(e.pts[e.pts.length - 1][0] - e.pts[0][0], e.pts[e.pts.length - 1][1] - e.pts[0][1]);
        if (len > 2.5 * Math.max(d, 100)) issues.push(`${where}: edge ${name(e)} takes a detour (${Math.round(len)}px for ${Math.round(d)}px)`);
        // reading order: every wire runs left to right, except one that closes a loop
        if (!e.back && !e.both && e.t.x + e.t.w / 2 <= e.s.x + e.s.w / 2) issues.push(`${where}: edge ${name(e)} runs right-to-left`);
      });
      if (geo.hub) { // hub views: one visible line into each callee
        const into = {}; geo.edges.forEach(e => { (into[e.to] ||= []).push(e); });
        Object.entries(into).forEach(([id, es]) => { es = es.filter(e => !e.back); if (es.some(e => e.from === geo.hub) && es.length > 1) issues.push(`${where}: hub callee "${(geo.byId[id] || {}).label || id}" has ${es.length} incoming lines`); });
      }
    }
    // author name tags hang under their card: no route may run through one
    (geo.nodes || []).forEach(n => { if (!n.tag) return; const r = { x: n.tag.x + 1, y: n.tag.y + 1, w: n.tag.w - 2, h: n.tag.h - 2 };
      geo.edges.forEach((o, j) => { if (segHit(r, j)) issues.push(`${where}: name tag "${n.tag.text}" lies on edge ${name(o)}`); }); });
    // lanes: every part sits inside its own lane, lanes never overlap, no route crosses a lane header
    const lanes = geo.lanes || [];
    lanes.forEach((l, i) => {
      lanes.slice(i + 1).forEach(m => { if (hit(l, m, -1)) issues.push(`${where}: lanes "${l.title}" and "${m.title}" overlap`); });
      (geo.nodes || []).forEach(n => {
        if (n.lane === i && (n.x < l.x || n.x + n.w > l.x + l.w || n.y < l.y || n.y + n.h + (n.tag ? 14 : 0) > l.y + l.h)) issues.push(`${where}: lane "${l.title}": node "${n.label}" sticks out`);
        if (n.lane != null && n.lane !== i && hit(n, l, -1)) issues.push(`${where}: lane "${l.title}": node "${n.label}" of another lane sits in it`);
        if (n.lane == null && hit(n, l, -1)) issues.push(`${where}: lane "${l.title}": node "${n.label}" belongs to no lane but sits in it`);
      });
    });
    (geo.blocks || []).forEach(b => geo.edges.forEach((o, j) => { if (segHit({ x: b.x + 1, y: b.y + 1, w: b.w - 2, h: b.h - 2 }, j)) issues.push(`${where}: lane "${b.title || ''}": header crossed by edge ${name(o)}`); }));
    const families = geo.families || [], inside = (a,b) => b.x > a.x && b.y > a.y && b.x+b.w < a.x+a.w && b.y+b.h < a.y+a.h;
    families.forEach(f => {
      const parent = families.find(p => p.id === f.parent);
      if (f.parent && (!parent || !inside(parent,f))) issues.push(`${where}: family "${f.label}" sticks out of its parent`);
      (f.nodeIds || []).forEach(id => { const n = geo.byId[id]; if (n && !inside(f,n)) issues.push(`${where}: family "${f.label}" does not contain "${n.label}"`); });
      families.filter(g => g !== f && g.parent === f.parent && g.id > f.id).forEach(g => { if (hit(f,g,-1)) issues.push(`${where}: families "${f.label}" and "${g.label}" overlap`); });
      geo.edges.forEach((e,i) => { if (segHit({x:f.x+8,y:f.y+3,w:Math.min(f.w-16,textW(f.label || f.id,11)+16),h:22},i)) issues.push(`${where}: family "${f.label}": header crossed by edge ${name(e)}`); });
    });
    return issues;
  }

  /* label-overlap audit used by `visual.py check` (world coordinates, real font metrics) */
  function auditSvg(svg, geo, where) {
    const issues = [], R = n => ({ x: n.x, y: n.y, w: n.w, h: n.h });
    const T = [...svg.querySelectorAll('text[data-t]')].map(t => { let b; try { b = t.getBBox(); } catch (_) { return null; } return { t: t.dataset.t, o: t.dataset.o, txt: t.textContent, b: { x: b.x, y: b.y, w: b.width, h: b.height } }; }).filter(x => x && x.b.w);
    const nodes = geo.nodes;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) if (hit(R(nodes[i]), R(nodes[j]), -1)) issues.push(`${where}: nodes "${nodes[i].label}" and "${nodes[j].label}" overlap`);
    T.forEach(a => {
      if (a.t === 'lt' || a.t === 'ft') {
        nodes.forEach(n => { if (hit(a.b, R(n), -1)) issues.push(`${where}: lane "${a.txt}": header covers node "${n.label}"`); });
        if (a.t === 'ft') { const f = (geo.families || []).find(f => f.id === a.o); if (f && (a.b.x < f.x || a.b.x+a.b.w > f.x+f.w)) issues.push(`${where}: family title "${a.txt}" overflows its box`); }
      } else if (a.t === 'el') {
        nodes.forEach(n => { if (hit(a.b, R(n), -1)) issues.push(`${where}: edge label "${a.txt}" covers node "${n.label}"`); });
      } else {
        const own = geo.byId[a.o];
        if (own && (a.b.x < own.x + 1 || a.b.x + a.b.w > own.x + own.w - 1)) issues.push(`${where}: text "${a.txt}" overflows node "${own.label}"`);
        nodes.forEach(n => { if (n !== own && hit(a.b, R(n), -1)) issues.push(`${where}: text "${a.txt}" overlaps node "${n.label}"`); });
      }
    });
    issues.push(...routeAudit(geo, where));
    const els = T.filter(a => a.t === 'el');
    for (let i = 0; i < els.length; i++) for (let j = i + 1; j < els.length; j++) if (hit(els[i].b, els[j].b, -1)) issues.push(`${where}: edge labels "${els[i].txt}" and "${els[j].txt}" overlap`);
    return issues;
  }

  function toggleTheme() {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('visual-theme', next); } catch (e) {}
  }

  function renderDoc() {
  const kind = D.kind || 'explore';
  const L = {
    recap:   { key: 'Key changes', files: 'Files changed', dia: 'What changed', tests: 'What to test', hunks: 'Annotated changes' },
    plan:    { key: 'What will change', files: 'Files to touch', dia: 'Design', tests: 'Verification', hunks: 'Code sketches' },
    explore: { key: 'Highlights', files: 'Map', dia: 'Diagram', tests: 'Try it', hunks: 'Key code' },
  }[kind] || {};
  const labels = Object.assign({}, L, D.labels || {});
  const navItems = [];
  const sec = (id, title, count) => { navItems.push([id, title]);
    const s = h(`<section id="${id}"><h2>${esc(title)}${count != null ? ` <span class="count">${count}</span>` : ''}</h2></section>`);
    app.appendChild(s); return s; };
  const base = p => p.split('/').pop();
  const dir = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
  const hunkByFile = {};

  /* ---------- hero ---------- */
  const m = D.meta || {};
  const eyebrow = [`<span class="kind ${esc(kind)}">${esc(kind)}</span>`];
  if (m.project) eyebrow.push(`<span>${esc(m.project)}</span>`);
  if (m.branch) eyebrow.push(`<span>⎇ ${esc(m.branch)}${m.base ? ' → ' + esc(m.base) : ''}</span>`);
  if (D.source) eyebrow.push(`<span>◇ ${esc(D.source)}</span>`);
  const st = D.stats || {};
  const stats = [];
  if (st.files != null) stats.push(`<div class="stat"><b>${st.files}</b><span>files</span></div>`);
  if (st.add != null) stats.push(`<div class="stat add"><b>+${st.add}</b><span>added</span></div>`);
  if (st.del != null) stats.push(`<div class="stat del"><b>−${st.del}</b><span>removed</span></div>`);
  if (st.commits) stats.push(`<div class="stat"><b>${st.commits}</b><span>commits</span></div>`);
  if (kind === 'plan' && (D.steps || []).length) stats.push(`<div class="stat"><b>${D.steps.length}</b><span>steps</span></div>`);
  if (kind === 'plan' && (D.files || []).length && st.files == null) stats.push(`<div class="stat"><b>${D.files.length}</b><span>files</span></div>`);
  if ((D.questions || []).length) stats.push(`<div class="stat"><b>${D.questions.length}</b><span>open questions</span></div>`);
  app.appendChild(h(`<header class="hero"><div class="eyebrow">${eyebrow.join('<span>·</span>')}</div>
    <h1>${inline(D.title || 'Visual')}</h1>${D.subtitle ? `<p class="sub">${inline(D.subtitle)}</p>` : ''}
    <div class="stats">${stats.join('')}</div></header>`));

  if (D.summary) sec('summary', 'Summary').appendChild(h(`<div class="card summary prose">${md(D.summary)}</div>`));

  /* ---------- key changes + files ---------- */
  const keys = D.keyChanges || [];
  const files = D.files || [];
  if (keys.length || files.length) {
    const s = sec('changes', keys.length ? labels.key : labels.files);
    const grid = h(`<div class="split"></div>`); s.appendChild(grid);
    if (keys.length) {
      const col = h(`<div class="changes"></div>`);
      keys.forEach((k, i) => {
        const tag = k.tag ? `<span class="tag t-${esc(String(k.tag).toLowerCase())}">${esc(k.tag)}</span>` : '';
        const chips = (k.files || []).map(f => `<span class="chip" data-file="${esc(f)}" title="${esc(f)}">${esc(base(f))}</span>`).join('');
        col.appendChild(h(`<div class="card change"><div class="num">${String(i + 1).padStart(2, '0')}</div><div>
          <h3>${inline(k.title)} ${tag}</h3>${k.detail ? `<div class="detail prose">${md(k.detail)}</div>` : ''}
          ${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`));
      });
      grid.appendChild(col);
    }
    if (files.length) grid.appendChild(renderFiles(files));
    if (!keys.length) grid.style.gridTemplateColumns = '1fr';
  }

  function normStatus(f) {
    const s = String(f.status || 'M').toUpperCase();
    return ({ ADD: 'A', ADDED: 'A', NEW: 'A', CREATE: 'A', MODIFY: 'M', MODIFIED: 'M', CHANGE: 'M', EDIT: 'M',
      DELETE: 'D', DELETED: 'D', REMOVE: 'D', RENAME: 'R', RENAMED: 'R' })[s] || s[0];
  }
  function renderFiles(files) {
    const aside = h(`<aside class="card files"></aside>`);
    const tot = files.reduce((a, f) => [a[0] + (f.add || 0), a[1] + (f.del || 0)], [0, 0]);
    const hasNums = files.some(f => f.add || f.del);
    aside.appendChild(h(`<div class="head"><span>${esc(labels.files)} · ${files.length}</span>${hasNums ? `<span><span class="plus">+${tot[0]}</span> <span class="minus">−${tot[1]}</span></span>` : ''}</div>`));
    const areas = {};
    files.forEach(f => (areas[f.area || '(root)'] ||= []).push(f));
    const many = Object.keys(areas).length > 8;
    Object.entries(areas).forEach(([area, fs]) => {
      const a = fs.reduce((x, f) => [x[0] + (f.add || 0), x[1] + (f.del || 0)], [0, 0]);
      const d = h(`<details class="area" ${many && fs.length > 6 ? '' : 'open'}><summary>${esc(area)}<span class="n">${hasNums ? `<span class="plus">+${a[0]}</span> <span class="minus">−${a[1]}</span>` : fs.length}</span></summary></details>`);
      fs.forEach(f => {
        const s = normStatus(f), tot = (f.add || 0) + (f.del || 0);
        const g = tot ? Math.round(5 * (f.add || 0) / tot) : 0;
        const blocks = hasNums ? `<span class="blocks">${[0,1,2,3,4].map(i => `<i class="${tot ? (i < g ? 'g' : 'r') : ''}"></i>`).join('')}</span>` : '';
        const nums = hasNums ? `${f.binary ? '<span>bin</span>' : `<span class="plus">+${f.add || 0}</span><span class="minus">−${f.del || 0}</span>`}${blocks}` : '';
        const pre = f.prefix ?? (f.area ? f.area + '/' : ''), rel = pre && f.path.startsWith(pre) && f.path !== pre ? f.path.slice(pre.length) : f.path;
        const row = h(`<div class="frow" data-path="${esc(f.path)}" title="${esc(f.path)}${f.from ? ' (from ' + esc(f.from) + ')' : ''}">
          <span class="st ${s}">${s}</span><span class="p"><bdi><span class="dir">${esc(dir(rel))}</span>${esc(base(rel))}</bdi></span>
          <span class="ad">${nums}</span>${f.note ? `<div class="fnote">${inline(f.note)}</div>` : ''}</div>`);
        d.appendChild(row);
      });
      aside.appendChild(d);
    });
    return aside;
  }

  /* ---------- diagrams (archify-style inline SVG, zoom + pan) ---------- */
  const cams = [];
  window.__geos = [];
  function renderDiagram(dg) {
    const geo = layoutGraph(dg, false);
    const used = [...new Set(geo.nodes.map(n => n.k))];
    const col = k => `var(--${KIND[k][0]})`, fill = k => `var(--${KIND[k][0]}-f)`;
    const legend = used.map(k => `<span><i style="border-color:${col(k)};background:${fill(k)}"></i>${KIND[k][1]}</span>`).join('')
      + (geo.nodes.some(n => CHG[String(n.change || '').toLowerCase()]) ? '<span style="color:var(--green)">● new</span><span style="color:var(--amber)">● changed</span>' : '');
    const fig = h(`<figure class="card dia"><figcaption><div class="ft">${inline(dg.title || '')}</div><div class="legend">${legend}</div></figcaption>
      <div class="canvas cam" tabindex="0" aria-label="Diagram canvas: drag to pan, pinch or Ctrl+scroll to zoom">${svgOf(geo, { title: dg.title })}
        <div class="ctl mini-ctl"><button data-z="out" title="Zoom out (−)">−</button><button data-z="fit" class="pct" title="Fit (0)">100%</button><button data-z="in" title="Zoom in (+)">+</button><button data-z="flow" title="Animate flow direction">≋</button><button data-z="full" title="Full screen (F)">⛶</button></div>
        <div class="cam-hint">Drag to pan · pinch or ⌘/Ctrl + scroll to zoom</div></div>
      ${dg.caption ? `<div class="fc">${inline(dg.caption)}</div>` : ''}</figure>`);
    fig._geo = geo; window.__geos.push([fig, geo, dg.title || 'diagram']);
    return fig;
  }
  function initDocCameras() {
    document.querySelectorAll('figure.dia').forEach(fig => {
      const el = fig.querySelector('.canvas'), svg = el.querySelector('svg'), geo = fig._geo, b = geo.bounds;
      const sizeIt = () => { if (el.classList.contains('full')) { el.style.height = ''; return; } const w = el.clientWidth || 800; el.style.height = Math.round(Math.max(220, Math.min(680, w * b.h / b.w + 8))) + 'px'; };
      sizeIt();
      const pct = el.querySelector('.pct');
      const cam = new Camera(el, svg, { wheel: 'ctrl', maxFit: 1, onChange: c => { pct.textContent = Math.round(c.s.k * 100) + '%'; } });
      cam.setSvg(svg, b); cam.fit(false); cams.push(cam);
      el.querySelector('.ctl').addEventListener('click', ev => {
        const z = ev.target.closest('button')?.dataset.z; if (!z) return;
        if (z === 'in') cam.zoomAt(1.4, null, null, true); else if (z === 'out') cam.zoomAt(1 / 1.4, null, null, true);
        else if (z === 'fit') cam.fit(); else if (z === 'flow') { el.classList.toggle('flowing'); ev.target.closest('button').classList.toggle('on'); } else if (z === 'full') { el.classList.toggle('full'); document.body.classList.toggle('noscroll', el.classList.contains('full')); sizeIt(); requestAnimationFrame(() => cam.fit(false)); }
      });
      el.addEventListener('keydown', ev => {
        if (ev.key === '+' || ev.key === '=') cam.zoomAt(1.4, null, null, true); else if (ev.key === '-') cam.zoomAt(1 / 1.4, null, null, true);
        else if (ev.key === '0') cam.fit(); else if (ev.key === 'f' || ev.key === 'F') el.querySelector('[data-z=full]').click();
        else if (ev.key === 'Escape' && el.classList.contains('full')) el.querySelector('[data-z=full]').click();
        else if (ev.key.startsWith('Arrow')) { const d = 60, m = { ArrowLeft: [d, 0], ArrowRight: [-d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] }[ev.key]; cam.pan(m[0], m[1], true); }
        else return; ev.preventDefault();
      });
      addEventListener('resize', () => { sizeIt(); if (!cam.touched) cam.fit(false); else cam.apply(); });
    });
  }
  if ((D.diagrams || []).length) {
    const s = sec('diagram', labels.dia);
    D.diagrams.forEach(dg => { try { s.appendChild(renderDiagram(dg)); } catch (err) { s.appendChild(h(`<div class="card empty">Diagram failed: ${esc(err.message)}</div>`)); } });
  }

  /* ---------- endpoints ---------- */
  if ((D.endpoints || []).length) {
    const s = sec('endpoints', 'Endpoints', D.endpoints.length);
    const g = h(`<div class="eps"></div>`); s.appendChild(g);
    const pj = v => esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2));
    D.endpoints.forEach(e => {
      const M = String(e.method || 'GET').toUpperCase(), ch = CHG[String(e.change || '').toLowerCase()];
      g.appendChild(h(`<div class="card ep"><div class="line"><span class="method m-${esc(M)}">${esc(M)}</span><span class="path">${esc(e.path)}</span>
        ${ch ? `<span class="tag" style="color:var(--${ch[0]})">${ch[1]}</span>` : ''}${e.auth ? `<span class="tag t-risk">${esc(e.auth)}</span>` : ''}</div>
        ${e.summary ? `<div class="desc">${inline(e.summary)}</div>` : ''}
        ${e.request != null ? `<details><summary>request</summary><pre class="json">${pj(e.request)}</pre></details>` : ''}
        ${e.response != null ? `<details><summary>response</summary><pre class="json">${pj(e.response)}</pre></details>` : ''}</div>`));
    });
  }

  /* ---------- steps (plan) ---------- */
  if ((D.steps || []).length) {
    const s = sec('steps', 'Steps', D.steps.length);
    const list = h(`<div class="steps"></div>`); s.appendChild(list);
    D.steps.forEach((st, i) => {
      const chips = (st.files || []).map(f => `<span class="chip" data-file="${esc(f)}" title="${esc(f)}">${esc(base(f))}</span>`).join('');
      list.appendChild(h(`<div class="step"><div class="dot">${i + 1}</div><div class="card body"><h3>${inline(st.title)}</h3>
        ${st.detail ? `<div class="detail prose">${md(st.detail)}</div>` : ''}${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`));
    });
  }

  /* ---------- annotated hunks ---------- */
  const hunks = (D.hunks || []).filter(x => (x.lines && x.lines.length) || x.code);
  if (hunks.length) {
    const s = sec('hunks', labels.hunks, hunks.length);
    const box = h(`<div class="card"></div>`); s.appendChild(box);
    const tabs = h(`<div class="tabs" role="tablist"></div>`); box.appendChild(tabs);
    hunks.forEach((hk, i) => {
      const lines = hk.lines && hk.lines.length ? hk.lines : String(hk.code).replace(/\n$/, '').split('\n').map((s, j) => ({ t: ' ', n: (hk.start || 1) + j, s }));

      } else {
        const starts = s => String(s || '').toLowerCase().startsWith(qs) ? 0 : 1;
        const ns = nodeIdx.filter(x => words.every(w => x.hay.includes(w))).sort((a, b) => starts(a.n.label) - starts(b.n.label) || (geo.byId[b.n.id] ? 1 : 0) - (geo.byId[a.n.id] ? 1 : 0)).slice(0, 7).map(x => ({ t: 'n', n: x.n }));
        const vs = viewIdx.filter(x => words.every(w => x.hay.includes(w))).slice(0, 5).map(x => ({ t: 'v', v: x.v }));
        hits = [...ns, ...vs];
      }
      hi = Math.min(hi, Math.max(0, hits.length - 1));
      if (!hits.length) {
        const near = nodes.map(n => [n, lev(qs, String(n.label).toLowerCase().replace(/^\//, '').slice(0, qs.length + 2))]).sort((a, b) => a[1] - b[1])[0];
        res.innerHTML = `<div class="none"><div aria-hidden="true">⌕</div><h4>Nothing called “${esc(q.value.trim())}”</h4>${near && near[1] <= Math.max(2, qs.length / 3) ? `Did you mean <button data-fill="${esc(near[0].label)}">${esc(near[0].label)}</button>?` : 'Try an agent, gate, script or view name.'}</div>`;
        return;
      }
      let html = '', last = '';
      hits.forEach((h, i) => {
        const grp = !qs ? 'Views' : h.t === 'n' ? 'Nodes' : 'Views';
        if (grp !== last) { html += `<div class="gt">${grp}</div>`; last = grp; }
        if (h.t === 'n') { const k = kindOf(h.n.kind, true), vs = viewsWith(h.n.id), here = geo.byId[h.n.id];
          html += `<button class="fr${i === hi ? ' on' : ''}" role="option" aria-selected="${i === hi}" data-i="${i}"><i style="background:var(--${KIND[k][0]})"></i><b>${mark(h.n.label, words)}</b><span>${esc(KIND[k][1])} · ${here ? 'this view' : esc(vs.map(v => shortT(v.title || v.id)).slice(0, 2).join(', ') || 'no view')}</span></button>`; }
        else html += `<button class="fr${i === hi ? ' on' : ''}" role="option" aria-selected="${i === hi}" data-i="${i}"><i style="background:var(--accent)"></i><b>${mark(h.v.title || h.v.id, words)}</b><span>${(h.v.nodeIds || []).length} nodes${h.v.id === cur ? ' · here' : ''}</span></button>`;
      });
      res.innerHTML = html;
      const on = res.querySelector('.fr.on'); on && on.scrollIntoView({ block: 'nearest' });
    }
    const openPal = () => { closeHelp(); closeExport(); pal.hidden = false; q.value = ''; hi = 0; drawHits(); q.focus(); };
    const closePal = () => { pal.hidden = true; q.blur(); };
    const pickHit = h => { if (!h) return; closePal(); if (h.t === 'n') findNode(h.n.id); else go(h.v.id); };
    q.addEventListener('input', () => { hi = 0; drawHits(); });
    q.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { hi = Math.min(hits.length - 1, hi + 1); drawHits(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); drawHits(); e.preventDefault(); }
      else if (e.key === 'Enter') { pickHit(hits[hi]); e.preventDefault(); }
      else if (e.key === 'Escape') { closePal(); e.preventDefault(); }
      e.stopPropagation();
    });
    res.addEventListener('click', e => { const f = e.target.closest('[data-fill]'); if (f) { q.value = f.dataset.fill; hi = 0; drawHits(); q.focus(); return; } const b = e.target.closest('[data-i]'); if (b) pickHit(hits[+b.dataset.i]); });
    res.addEventListener('pointermove', e => { const b = e.target.closest('[data-i]'); if (b && +b.dataset.i !== hi) { hi = +b.dataset.i; res.querySelectorAll('.fr').forEach(x => { const on = +x.dataset.i === hi; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); }); } });
    pal.addEventListener('click', e => { if (e.target === pal) closePal(); });
    $('m-find').addEventListener('click', openPal);

    /* keyboard */
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); return pal.hidden ? openPal() : closePal(); }
      if ((e.target.matches && e.target.matches('input, textarea')) || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key;
      if (k === '+' || k === '=') cam.zoomAt(1.4, null, null, true);
      else if (k === '-' || k === '_') cam.zoomAt(1 / 1.4, null, null, true);
      else if (k === '0') cam.fit();
      else if (k === '1') cam.actual();
      else if (k === 'Escape' || k === 'Backspace') { if (!$('m-helpbox').hidden) closeHelp(); else if (!$('m-export-pop').hidden) closeExport(); else if ($('m-vpop') && !$('m-vpop').hidden) togglePill(false); else if (sel) deselect(); else up(); }
      else if (k === 'Enter' && sel) open(sel);
      else if (k === '/') openPal();
      else if (k === '?') $('m-help').click();
      else if (k === 'i' || k === 'I') togglePill();
      else if ((k === '[' || k === ']') && sel) setTab(TABS[(TABS.indexOf(tab) + (k === ']' ? 1 : -1) + TABS.length) % TABS.length]);
      else if (k === 'o' || k === 'O') setTree(!document.body.classList.contains('tree-open'));
      else if (k === 'f' || k === 'F') setFlow(!stage.classList.contains('flowing'));
      else if (k.startsWith('Arrow')) { const d = 80, m = { ArrowLeft: [d, 0], ArrowRight: [-d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] }[k]; cam.pan(m[0], m[1], true); }
      else return;
      e.preventDefault();
    });
    addEventListener('popstate', () => { const p = new URLSearchParams(location.hash.slice(1)); const v = p.get('view') || rootId; if (v !== cur) go(v, { replace: true, select: p.get('node') || undefined }); else if (p.get('node')) select(p.get('node')); else if (sel) deselect(); });
    // the stage changes size when the details strip opens or the window resizes: keep the zoom, refit only an untouched view
    let rz;
    new ResizeObserver(() => { if (!cam) return; cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (!cam.touched) cam.set(startView()); else cam.apply(); if (sel && geo.byId[sel]) { const n = geo.byId[sel]; cam.reveal({ x: n.x, y: n.y, w: n.w, h: n.h }); } }); }).observe(stage);

    /* export: resolve CSS variables into attributes so the file stands alone */
    function standalone(scale) {
      const clone = svg.cloneNode(true), b = geo.bounds;
      const src = svg.querySelectorAll('*'), dst = clone.querySelectorAll('*');
      const props = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'fill-opacity', 'stroke-opacity', 'font-family', 'font-size', 'font-weight', 'letter-spacing', 'visibility'];
      src.forEach((el, i) => { const cs = getComputedStyle(el); props.forEach(p => { const v = cs.getPropertyValue(p); if (v) dst[i].style.setProperty(p, v); }); });
      clone.querySelectorAll('title').forEach(t => t.remove());
      clone.setAttribute('viewBox', `${b.x} ${b.y} ${b.w} ${b.h}`); clone.setAttribute('width', b.w * scale); clone.setAttribute('height', b.h * scale);
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      Object.entries({ x: b.x, y: b.y, width: b.w, height: b.h, fill: getComputedStyle(stage).backgroundColor }).forEach(([k2, v]) => bg.setAttribute(k2, v));
      clone.insertBefore(bg, clone.firstChild.nextSibling);
      return new XMLSerializer().serializeToString(clone);
    }
    function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
    function exportView(x) {
      const stem = (D.slug || D.title || 'map').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + cur.replace(/[^a-z0-9]+/gi, '-');
      if (x === 'svg') download(stem + '.svg', new Blob([standalone(1)], { type: 'image/svg+xml' }));
      else if (x === 'png') {
        const img = new Image(), s = standalone(2), b = geo.bounds;
        img.onload = () => { const c = document.createElement('canvas'); c.width = b.w * 2; c.height = b.h * 2; c.getContext('2d').drawImage(img, 0, 0); c.toBlob(bl => download(stem + '.png', bl)); };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
      } else if (x === 'link') { navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => status('Link copied'), () => status(location.href)); }
      else if (x === 'json') { const { meta, kind, ...model } = D; download(stem.split('-' + cur)[0] + '.json', new Blob([JSON.stringify(model, null, 2)], { type: 'application/json' })); }
      if (x !== 'link') status('Exported ' + x.toUpperCase());
    }

    /* boot: ghost nodes show until the first view is laid out */
    const boot = () => {
      const p0 = new URLSearchParams(location.hash.slice(1));
      const v0 = V[p0.get('view')] ? p0.get('view') : rootId;
      stack = chain(v0); mount(v0); cam.set(startView()); cam.touched = false;
      $('m-ghosts').remove();
      const n0 = p0.get('node') || (Q.get('shot') && v0 !== rootId ? subjectOf(V[v0]) || (V[v0].nodeIds || [])[0] : null);
      if (n0 && geo.byId[n0]) select(n0, { reveal: false });
      setHash(true);
    };
    if (window.__instant) boot(); else requestAnimationFrame(() => setTimeout(boot, 16));

    window.__mapAudit = () => {
      const out = [], host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-99999px;top:0;width:2000px;height:2000px;visibility:hidden';
      document.body.appendChild(host);
      const routes = {}, layouts = {}, laneReport = {};
      views.forEach(v => { const L = planOf(v.id); if (L.hub) laneReport[v.id] = L.lanes.map(l => l.title); });
      if (Q.get('optimize')) views.forEach(v => { if (!v.layout && !planOf(v.id).hub) { const r = optimize(v.id); layouts[v.id] = r.pos; layoutCache[v.id] = r.pos; } });
      views.forEach(v => { if (!(v.nodeIds || []).some(i => N[i])) return; const { g, markup } = buildView(v.id); host.innerHTML = markup; out.push(...auditSvg(host.firstChild, g, 'view ' + v.id)); Object.entries(g.stats || {}).forEach(([k, n]) => { routes[k] = (routes[k] || 0) + n; });
        g.edges.filter(e => e.how === 'fallback').forEach(e => (routes.fallbackEdges ||= []).push(`${v.id}: ${e.from}(${e.fs})→${e.to}(${e.ts})`)); });
      host.remove();
      const deep = views.filter(v => v.parent).sort((a, b) => chain(b.id).length - chain(a.id).length || (b.nodeIds || []).length - (a.nodeIds || []).length)[0];
      const laneView = laneReport['super-build'] ? 'super-build' : Object.keys(laneReport)[0] || null;
      return { overlaps: out, routes, layouts, lanes: laneReport, checked: views.length + ' views', childView: deep ? deep.id : null, laneView };
    };
  }

  try { (D.kind === 'map' ? renderMap : renderDoc)(); } catch (err) { errors.push('render: ' + err.message); console.error(err); }

  /* ---------- self-check hook for `visual.py check` ---------- */
  if (Q.get('check')) {
    const report = () => {
      let res = { overlaps: [], checked: 0 };
      try {
        if (window.__mapAudit) res = window.__mapAudit();
        else { (window.__geos || []).forEach(([fig, geo, name]) => res.overlaps.push(...auditSvg(fig.querySelector('svg'), geo, 'diagram ' + name))); res.checked = (window.__geos || []).length + ' diagrams'; }
      } catch (err) { errors.push('check: ' + err.message); }
      res.errors = errors;
      const pre = document.createElement('pre'); pre.id = 'visual-check'; pre.hidden = true; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(report, report);
  }
})();
</script>
