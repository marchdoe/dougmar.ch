  See ../THIRD_PARTY_NOTICES.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<script>
  try { const t = localStorage.getItem('visual-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* Clean flowchart (GitHub Primer-like): light first, dark when the system or the toggle asks. */
  :root {
    --bg: #ffffff; --bg-2: #f6f8fa; --panel: #ffffff; --panel-2: #f6f8fa; --border: #d8dee4; --border-2: #d1d9e0;
    --text: #1f2328; --muted: #59636e; --dim: #818b98; --grid: rgba(31,35,40,.06); --mask: #ffffff; --arrow: #8c959f;
    --shadow: 0 8px 24px rgba(31,35,40,.10); --dot: #e6eaef; --gridline: transparent; --chrome: rgba(255,255,255,.94);
    --accent: #0969da; --accent-fg: #ffffff; --lane: rgba(31,35,40,.025);
    --cyan: #0969da; --green: #1a7f37; --violet: #8250df; --amber: #9a6700; --rose: #cf222e; --orange: #bc4c00; --slate: #59636e; --fuchsia: #bf3989;
    --k-public: #0969da; --k-lane: #0f766e; --k-ext: #8250df; --k-verb: #bf3989; --k-script: #6e7781; --k-hook: #cf222e; --k-board: #9a6700;
    --w-calls: #424a53; --w-feeds: #0969da; --w-triggers: #8250df; --w-state: #afb8c1; --w-guard: #cf222e;
    --add-bg: rgba(26,127,55,.10); --add-tx: #1a7f37; --del-bg: rgba(207,34,46,.08); --del-tx: #cf222e;
    color-scheme: light;
    --accent-f: color-mix(in srgb, var(--accent) 12%, var(--panel));
    --cyan-f: color-mix(in srgb, var(--cyan) 9%, var(--panel));
    --green-f: color-mix(in srgb, var(--green) 9%, var(--panel));
    --violet-f: color-mix(in srgb, var(--violet) 9%, var(--panel));
    --amber-f: color-mix(in srgb, var(--amber) 10%, var(--panel));
    --rose-f: color-mix(in srgb, var(--rose) 8%, var(--panel));
    --orange-f: color-mix(in srgb, var(--orange) 9%, var(--panel));
    --slate-f: color-mix(in srgb, var(--slate) 8%, var(--panel));
    --fuchsia-f: color-mix(in srgb, var(--fuchsia) 8%, var(--panel));
    --k-public-f: color-mix(in srgb, var(--k-public) 8%, var(--panel));
    --k-lane-f: color-mix(in srgb, var(--k-lane) 8%, var(--panel));
    --k-ext-f: color-mix(in srgb, var(--k-ext) 7%, var(--panel));
    --k-verb-f: color-mix(in srgb, var(--k-verb) 7%, var(--panel));
    --k-script-f: color-mix(in srgb, var(--k-script) 5%, var(--panel));
    --k-hook-f: color-mix(in srgb, var(--k-hook) 12%, var(--panel));
    --k-board-f: color-mix(in srgb, var(--k-board) 9%, var(--panel));
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --bg: #0d1117; --bg-2: #010409; --panel: #0d1117; --panel-2: #151b23; --border: #262c36; --border-2: #3d444d;
    --text: #f0f6fc; --muted: #9198a1; --dim: #656c76; --grid: rgba(240,246,252,.05); --mask: #0d1117; --arrow: #656c76;
    --shadow: 0 10px 30px rgba(1,4,9,.55); --dot: #161b22; --gridline: transparent; --chrome: rgba(13,17,23,.92);
    --accent: #4493f8; --accent-fg: #ffffff; --lane: rgba(240,246,252,.025);
    --cyan: #4493f8; --green: #3fb950; --violet: #ab7df8; --amber: #d29922; --rose: #f85149; --orange: #db6d28; --slate: #9198a1; --fuchsia: #db61a2;
    --k-public: #4493f8; --k-lane: #2dd4bf; --k-ext: #ab7df8; --k-verb: #f778ba; --k-script: #9198a1; --k-hook: #f85149; --k-board: #d29922;
    --w-calls: #b7bdc8; --w-feeds: #4493f8; --w-triggers: #ab7df8; --w-state: #4d5562; --w-guard: #f85149;
    --add-bg: rgba(63,185,80,.13); --add-tx: #56d364; --del-bg: rgba(248,81,73,.12); --del-tx: #ff7b72;
    color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg-2: #010409; --panel: #0d1117; --panel-2: #151b23; --border: #262c36; --border-2: #3d444d;
    --text: #f0f6fc; --muted: #9198a1; --dim: #656c76; --grid: rgba(240,246,252,.05); --mask: #0d1117; --arrow: #656c76;
    --shadow: 0 10px 30px rgba(1,4,9,.55); --dot: #161b22; --gridline: transparent; --chrome: rgba(13,17,23,.92);
    --accent: #4493f8; --accent-fg: #ffffff; --lane: rgba(240,246,252,.025);
    --cyan: #4493f8; --green: #3fb950; --violet: #ab7df8; --amber: #d29922; --rose: #f85149; --orange: #db6d28; --slate: #9198a1; --fuchsia: #db61a2;
    --k-public: #4493f8; --k-lane: #2dd4bf; --k-ext: #ab7df8; --k-verb: #f778ba; --k-script: #9198a1; --k-hook: #f85149; --k-board: #d29922;
    --w-calls: #b7bdc8; --w-feeds: #4493f8; --w-triggers: #ab7df8; --w-state: #4d5562; --w-guard: #f85149;
    --add-bg: rgba(63,185,80,.13); --add-tx: #56d364; --del-bg: rgba(248,81,73,.12); --del-tx: #ff7b72;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
  a { color: var(--cyan); }
  code, .mono { font-family: var(--mono); font-size: .86em; }
  :not(pre) > code { overflow-wrap: anywhere; background: var(--panel-2); border: 1px solid var(--border); padding: .05em .35em; border-radius: 5px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); }
  .bar .wrap { display: flex; align-items: center; gap: 14px; height: 50px; }
  .bar .brand { font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .bar nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .bar nav a { color: var(--muted); text-decoration: none; font: 500 13px var(--sans); padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
  .bar nav a:hover { color: var(--text); background: var(--panel); }
  .btn { background: var(--panel); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; height: 32px; padding: 0 12px; font: 500 13px var(--sans); cursor: pointer; }
  .btn:hover { border-color: var(--cyan); }
  .btn:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* hero */
  header.hero { padding: 40px 0 8px; }
  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 12px var(--mono); color: var(--muted); }
  .kind { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .kind.recap { color: var(--green); border-color: var(--green); background: var(--green-f); }
  .kind.plan { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-f); }
  .kind.explore { color: var(--violet); border-color: var(--violet); background: var(--violet-f); }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; letter-spacing: -.025em; margin: 14px 0 8px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 18px; max-width: 820px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { display: flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; }
  .stat b { font: 700 17px var(--mono); }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat.add b { color: var(--green); } .stat.del b { color: var(--rose); }

  section { padding: 26px 0 8px; scroll-margin-top: 60px; }
  h2 { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  h2 .count { color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  .prose p { margin: 0 0 12px; max-width: 860px; } .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .summary { padding: 20px 22px; font-size: 16px; }

  /* key changes + files */
  .split { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split > aside { position: sticky; top: 64px; } }
  .changes { display: grid; gap: 10px; }
  .change { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 18px; }
  .change .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--panel-2); border: 1px solid var(--border-2); color: var(--muted); }
  .change h3 { margin: 2px 0 4px; font-size: 16px; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .change .detail { color: var(--muted); font-size: 14.5px; }
  .tag { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .t-added, .t-new, .t-add { color: var(--green); } .t-changed, .t-modified, .t-change { color: var(--cyan); } .t-removed, .t-delete { color: var(--rose); }
  .t-fix { color: var(--amber); } .t-refactor { color: var(--violet); } .t-docs, .t-chore { color: var(--slate); } .t-risk { color: var(--orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 12px var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--cyan); }

  .files { padding: 6px 0; overflow: hidden; }
  .files .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 8px; font: 600 12px var(--mono); color: var(--muted); }
  .area { border-top: 1px solid var(--border); }
  .area > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 16px; font: 600 12.5px var(--mono); color: var(--text); }
  .area > summary::-webkit-details-marker { display: none; }
  .area > summary::before { content: "▸"; color: var(--dim); transition: transform .15s; }
  .area[open] > summary::before { transform: rotate(90deg); }
  .area > summary .n { margin-left: auto; font-weight: 500; }
  .frow { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 16px 5px 30px; font: 12.5px var(--mono); cursor: default; }
  .frow.link { cursor: pointer; } .frow.link:hover, .frow.hl { background: var(--panel-2); }
  .frow .st { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
  .st.A { color: var(--green); } .st.M { color: var(--amber); } .st.D { color: var(--rose); } .st.R { color: var(--violet); }
  .frow .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .frow .p bdi { direction: ltr; } .frow .p .dir { color: var(--dim); }
  .frow .ad { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .plus { color: var(--green); } .minus { color: var(--rose); }
  .blocks { display: inline-flex; gap: 2px; } .blocks i { width: 7px; height: 7px; border-radius: 2px; background: var(--border-2); }
  .blocks i.g { background: var(--green); } .blocks i.r { background: var(--rose); }
  .fnote { grid-column: 2 / 4; color: var(--muted); font: 12.5px/1.45 var(--sans); margin-top: -2px; }

  /* diagrams */
  figure.dia { margin: 0 0 18px; padding: 18px 18px 14px; overflow: hidden; }
  @media (min-width: 1300px) { #diagram { position: relative; left: 50%; transform: translateX(-50%); width: min(1640px, calc(100vw - 64px)); } }
  figure.dia figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; margin-bottom: 10px; }
  figure.dia .ft { font-weight: 600; font-size: 16px; }
  figure.dia .fc { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .canvas { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--border); background-color: var(--bg-2); touch-action: none; cursor: grab; outline: none;
    background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px), linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); }
  .canvas:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }
  .canvas.grabbing, .stage.grabbing { cursor: grabbing; }
  .canvas svg { display: block; position: absolute; inset: 0; }
  .canvas.full { position: fixed; inset: 12px; z-index: 60; border-radius: 14px; box-shadow: var(--shadow); height: auto !important; }
  body.noscroll { overflow: hidden; }
  .cam-hint { position: absolute; left: 10px; bottom: 8px; font: 500 11px var(--mono); color: var(--dim); pointer-events: none; opacity: 0; transition: opacity .2s; }
  .canvas:hover .cam-hint { opacity: 1; }
  .ctl { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 11px; background: var(--chrome); border: 1px solid var(--border-2); box-shadow: var(--shadow); backdrop-filter: blur(10px); z-index: 4; }
  .ctl button { min-width: 30px; height: 28px; border: 0; background: none; color: var(--text); font: 600 13px var(--mono); border-radius: 8px; cursor: pointer; padding: 0 7px; }
  .ctl button:hover:not(:disabled) { background: var(--panel-2); color: var(--cyan); }
  .ctl button:disabled { opacity: .35; cursor: default; }
  .ctl .pct { min-width: 54px; font-weight: 500; color: var(--muted); }
  .ctl .sep { width: 1px; height: 18px; background: var(--border-2); margin: 0 3px; }
  .ctl .depth { font: 700 10px var(--mono); letter-spacing: .12em; color: var(--dim); padding: 0 8px; }
  .mini-ctl { opacity: .0; transition: opacity .2s; } .canvas:hover .mini-ctl, .canvas:focus-within .mini-ctl, .canvas.full .mini-ctl { opacity: 1; }
  @media (hover: none) { .mini-ctl { opacity: 1; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 600 11px var(--mono); color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid; margin-right: 6px; vertical-align: -1px; }
  svg .n-mask { fill: var(--mask); }
  svg .n-body { stroke-width: 1.5; transition: stroke-width .15s, filter .15s; }
  svg .n-label { fill: var(--text); font: 600 13px var(--mono); letter-spacing: -.01em; }
  svg .n-sub { fill: var(--muted); font: 10px var(--mono); }
  svg .e-label { fill: var(--muted); font: 600 10px var(--mono); }
  svg .e-lbg { fill: var(--bg-2); stroke: var(--border); }
  svg .g-label { font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  svg .badge-tx { font: 700 8.5px var(--mono); letter-spacing: .08em; }
  svg .edge { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke-width .15s, opacity .2s; }
  svg .halo { fill: none; stroke: var(--bg-2); stroke-width: 6; }
  svg .hitline { fill: none; stroke: transparent; stroke-width: 12; }
  svg .flowline { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 10 70; opacity: 0; pointer-events: none; }
  .flowing svg .flowline { opacity: .9; animation: flowdash 2.4s linear infinite; }
  .flowing svg .edge { opacity: .8; }
  @keyframes flowdash { to { stroke-dashoffset: -160; } }
  /* intake badges and the view tour: a ticket dot rides the loop while flow is on */
  svg .intake-chip { fill: #fff; stroke: var(--border-2); stroke-width: 1.2; }
  svg .intake-tx { fill: var(--muted); font: 600 10.5px var(--sans); }
  svg .intake-chip.dashed { fill: var(--panel); stroke: var(--w-feeds); stroke-dasharray: 3 3; }
  svg .intake-mark { fill: #1b1f23; font: 700 13px var(--sans); }
  svg .intake-chip.dashed + .intake-mark { fill: var(--w-feeds); }
  svg .tour, svg .tour-glow { display: none; pointer-events: none; }
  .flowing svg .tour, .flowing svg .tour-glow { display: inline; }
  svg .tour-glow { fill: none; stroke-width: 7; stroke-linecap: round; filter: blur(2.5px); }
  svg .tour-dot { fill: var(--w-feeds); stroke: var(--bg-2); stroke-width: 1.5; filter: drop-shadow(0 0 6px var(--w-feeds)); }
  svg .tour-packet { fill: var(--w-feeds); }
  .flowing svg .node.tour-stop { transform-box: fill-box; transform-origin: center; animation: tour-pulse 8s ease-in-out infinite; }
  @keyframes tour-pulse { 0%, 9%, 100% { transform: none; filter: none; } 4% { transform: scale(1.04); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--w-feeds) 60%, transparent)); } }
  .flowing svg .edge-g.back .edge { animation: march 1.1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -22; } }
  @media (prefers-reduced-motion: reduce) { svg .tour, svg .tour-glow { display: none !important; } .flowing svg .node.tour-stop, .flowing svg .edge-g.back .edge { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .flowing svg .flowline { animation: none; opacity: 0; } .flowing svg .edge { opacity: 1; } }
  .ctl button.on { color: var(--cyan); background: var(--cyan-f); }
  svg .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { svg .flow { animation: none; } }
  /* reading depths (archify): far out = shapes + names; closer = subs, verbs, edge labels */
  .depth-read { transition: opacity .18s; }
  [data-depth="map"] .depth-read { opacity: 0; pointer-events: none; }
  /* typed node styles (map) */
  svg .node { cursor: pointer; outline: none; }
  svg .node .n-ring { fill: none; stroke-width: 1.2; stroke-opacity: .38; }
  svg .node.pub .n-body { stroke-width: 2.6; }
  svg .node.pub .n-label { font-weight: 700; }
  svg .node.priv .n-body { stroke-width: 1; stroke-opacity: .7; fill-opacity: .5; }
  svg .node.priv .n-label { fill: var(--muted); font-weight: 500; font-size: 11.5px !important; }
  svg .node.priv .n-sub { display: none; }
  svg .node.priv .n-sigil { opacity: .7; }
  svg .node .n-stack { fill: var(--mask); stroke-width: 1; stroke-opacity: .45; }
  svg .node .ini-tx { font: 700 7.5px var(--mono); }
  svg .node .tab-tx { font: 800 8px var(--mono); letter-spacing: .14em; fill: var(--mask); }
  svg .node .verb-chip { fill: var(--mask); stroke-width: .9; stroke-opacity: .6; }
  svg .node .verb-tx { font: 600 9.5px var(--mono); }
  svg .node.subject .n-body { stroke-dasharray: none; filter: drop-shadow(0 0 10px color-mix(in srgb, currentColor 0%, transparent)); }
  svg .node:hover .n-body, svg .node:focus-visible .n-body { stroke-width: 3; }
  svg .node.priv:hover .n-body { stroke-opacity: 1; }
  svg .node.priv:hover .n-label { fill: var(--text); }
  svg .node:focus-visible .n-mask { stroke: var(--cyan); stroke-width: 3; }
  svg .edge-g.hov .edge, svg .edge-g.hot .edge { stroke-width: 2.6; }
  .focusing svg .node:not(.sel):not(.nb) { opacity: .28; }
  .focusing svg .edge-g:not(.hot) { opacity: .15; }
  .focusing svg .e-lab:not(.hot) { opacity: .15; }
  svg .node, svg .edge-g, svg .e-lab { transition: opacity .2s; }
  svg .node.sel .n-body { stroke-width: 3.2; }
  svg .node.sel .n-mask { stroke: var(--accent); stroke-width: 2; }

  .diff { overflow-x: auto; border-top: 1px solid var(--border); background: var(--bg-2); }

  .diff td { padding: 0 10px; white-space: pre; vertical-align: top; }
  .diff td.ln { color: var(--dim); text-align: right; user-select: none; width: 1%; padding: 0 8px; }

  .diff tr.add { background: var(--add-bg); } .diff tr.add td.code, .diff tr.add td.sg { color: var(--add-tx); }
  .diff tr.del { background: var(--del-bg); } .diff tr.del td.code, .diff tr.del td.sg { color: var(--del-tx); }
  .diff tr.hdr td { color: var(--violet); background: var(--panel-2); padding: 3px 10px; }
  .diff.newfile tr.add { background: none; } .diff.newfile tr.add td.code { color: var(--text); } .diff.newfile td.sg, .diff.newfile td.ln.o { display: none; }
  .diff tr.noted td.code { box-shadow: inset 2px 0 0 var(--amber); }
  .pin { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--amber); color: #111; font: 700 10px var(--mono); }
  .notes { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 10px; align-content: start; }
  @media (min-width: 1000px) { .notes { border-left: 1px solid var(--border); } }
  .note { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; color: var(--muted); }
  .note b { color: var(--text); font-weight: 600; }
  .more { padding: 8px 18px; color: var(--dim); font: 12px var(--mono); border-top: 1px solid var(--border); }

  /* risks / tests / questions */

  @media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

  .lvl { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; margin-top: 2px; }
  .lvl.high { color: var(--rose); } .lvl.med, .lvl.medium { color: var(--amber); } .lvl.low { color: var(--green); }
  .li input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--green); }
  .li .cmd { display: block; margin-top: 4px; color: var(--muted); }
  .q { padding: 14px 18px; border-top: 1px solid var(--border); } .q:first-child { border-top: none; }
  .q .qq { font-weight: 600; } .q .qd { color: var(--muted); font-size: 14px; margin-top: 4px; }

  footer { padding: 34px 0 44px; color: var(--dim); font: 12px var(--mono); }
  .empty { color: var(--dim); padding: 14px 18px; }

<script id="visual-data" type="application/json">{"title":"dougmar.ch nightly pipeline","pack":"dougmar.ch","branch":"main @ e362a4f0","sourcesBase":"","kinds":{"lane":"a model call","hook":"a check that can stop the night","script":"node/shell script or step","step":"GitHub Actions workflow or job","board":"files and data the night reads or writes: signals/today.yml, elements/preset.ts, handoff.json, archive/<date>, dist, cost.json"},"nodes":[{"id":"daily-redesign-wf","label":"Daily Redesign","kind":"step","sublabel":"nightly spine","what":"The GitHub Actions workflow that builds one new design each night and pushes it to main. Its jobs, in order, are [[guard-job]], [[redesign-job]], [[publish-job]] and [[notify-job]].","when":"Cron `15 4 * * *` and `15 5 * * *` (UTC), which are 00:15 America/New_York in summer and winter. Also by `workflow_dispatch` with `dry_run` and `resume_run_id` inputs, or dispatched by the [[backstop-script]].","how":"One run at a time (`concurrency: daily-redesign`, no cancel). The run title carries the inputs (`Daily Redesign (dry run)`, `(resume <id>)`) because the runs API does not return them.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml"]},{"id":"guard-job","label":"guard","kind":"step","what":"Decides whether this trigger is the day's run. Drops the cron entry that is an hour wrong for the current DST offset, then skips the day if [[backstop-script]] `--night-exists` finds `archive/<today>/record.json` on main.","when":"First job of every run. The night-exists check runs on schedule and on a non-dry, non-resume dispatch; a dry run or a resume always proceeds.","how":"A schedule whose zone does not match (`15 4` in EST, `15 5` in EDT) sets `run=false`. If the night-exists read fails it warns and runs anyway.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/nightly-backstop.js"]},{"id":"redesign-job","label":"redesign","kind":"step","what":"The job that holds the paid work: install, test main, collect inputs, run [[daily-redesign-js]], then the [[render-gate]] and staging. 80-minute job timeout; `RUN_BUDGET_MINUTES=60` is the pipeline's own deadline.","when":"After [[guard-job]] sets `run=true`.","how":"Steps in order: checkout, pnpm install, Playwright chromium (cached by version), `claude` CLI pinned to 2.1.280, [[main-red-check]], [[collect-ratings]], [[collect-signals]], [[collect-references]], [[prior-attempts]], resume steps if any, the pipeline, render check, stage, upload. Env `SHIP_GATE=lenient`; `WEIGHT_SIGNALS`, `WEIGHT_INSPIRATION`, `WEIGHT_RATINGS` default to 5 and `WEIGHT_RISK` to empty.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml"]},{"id":"publish-job","label":"publish","kind":"step","what":"Applies the night's patch to a fresh checkout and pushes it to main with the deploy key, then opens the rating issue. It runs no generated code, only `git apply` and `git push`.","when":"After [[redesign-job]] succeeds and the run is not a dry run.","how":"Downloads `nightly-<run_id>`, `git apply --index --binary`, commits `chore: daily redesign <date>`, then up to 3 `pull --rebase --autostash` + `push` attempts 10 seconds apart. After the push it reads the needs-human and shipped-with-faults sections and opens the [[rating-issue]].","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/print-needs-human-section.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/print-shipped-with-faults-section.js"]},{"id":"notify-job","label":"notify","kind":"step","what":"Opens a `pipeline-failure` issue when [[redesign-job]] or [[publish-job]] fails. The body links the run, names the failed job and the spend, and says how to resume.","when":"On `redesign` or `publish` result `failure`.","how":"Downloads `build-failed-<run_id>`, runs `scripts/print-failed-run-cost.js` for the spend, and for a redesign failure tells the reader to dispatch with `resume_run_id` so only the engineer onward is paid again.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/print-failed-run-cost.js"]},{"id":"nightly-backstop-wf","label":"Nightly Backstop","kind":"step","what":"A second workflow that notices a night that never ran, because GitHub does not promise to deliver a scheduled run and `notify` only fires on failure.","when":"Cron at 14:30, 17:30 and 20:30 UTC; also manual with `dry_run` defaulting to true.","how":"Three jobs: `check` runs [[backstop-script]]; `Dispatch Daily Redesign` runs `gh workflow run daily-redesign.yml -f resume_run_id=...`; `report` opens a `pipeline-failure` issue. A dry run decides and prints but dispatches and opens nothing.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/nightly-backstop.yml"]},{"id":"backstop-script","label":"nightly-backstop.js","kind":"script","what":"Read-only decision script. It prints one of: nothing, wait, dispatch, or open an issue.","when":"Run by the `check` job of [[nightly-backstop-wf]]; `--night-exists` is the form [[guard-job]] calls.","how":"Rules in order: (1) `archive/<today>/record.json` on main means the night exists; (2) a Daily Redesign run is queued or running, so wait; (3) today already had a dispatch and still no night, so open one issue; (4) otherwise dispatch once, resuming a failed run that left a `handoff.json`. Dry runs do not count as a dispatch.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/nightly-backstop.js"]},{"id":"rollback-wf","label":"Rollback Daily Redesign","kind":"step","what":"Manual workflow that `git revert`s the newest nightly commit(s) so a broken design can be undone before tomorrow.","when":"Manual dispatch only; `commits_back` (default 1) and `dry_run` (default on).","how":"Two jobs: `revert` builds with no credential, `push` holds the deploy key and only runs `git am` and `git push`. Shares the `daily-redesign` concurrency group. Skips nightlies already reverted.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/rollback.yml"]},{"id":"ci-wf","label":"CI","kind":"step","what":"Pull-request and push checks: Biome lint, tsc typecheck, unit tests plus the site-health e2e, and an architecture job.","when":"On push and pull request.","how":"The e2e run uses the committed design and does not set `NIGHTLY_RUN`, so the three render-health probes run there. Main being red here is what [[main-red-check]] guards against at the start of a night.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/ci.yml"]},{"id":"main-red-check","label":"Stop if main is red","kind":"hook","what":"Runs `pnpm test` before any paid call.","when":"First step after install in [[redesign-job]].","how":"A failing unit test fails the job before a model is called, so no money is spent on a night that could not ship.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml"]},{"id":"collect-ratings","label":"collect-ratings.js","kind":"script","what":"Harvests the owner's rating comments from open `daily-rating` issues into `archive/<date>/rating-<ts>.json` and closes each harvested issue.","when":"First data step in [[redesign-job]]; needs `GH_TOKEN`, never fails the run.","how":"Only comments from OWNER, MEMBER or COLLABORATOR count, and the issue itself must be opened by a known account, because comment text reaches the Art Director prompt. Grade A or B ratings promote the screenshot into `references/`.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/collect-ratings.js"]},{"id":"collect-signals","label":"collect-signals.js","kind":"script","what":"Runs every signal provider in parallel and writes `signals/today.yml` and `today.meta.yml`.","when":"Step in [[redesign-job]] with the weather, news, Alpha Vantage and Product Hunt secrets in env.","how":"19 providers under `scripts/signals/`: air quality, Awwwards, books, day of week, GitHub, golf, Hacker News, holidays, lunar, market, music, news, Product Hunt, quote, season, sidebar, sports, sun, weather. A provider whose required key is missing is skipped, not failed.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/collect-signals.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/signals/weather.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/signals/quote.js"]},{"id":"collect-references","label":"collect-references.js","kind":"script","what":"Writes `signals/today.references.md`, the design reference library the Art Director selects from.","when":"Step in [[redesign-job]] after [[collect-signals]].","how":"With no fresh brief on disk (the normal case) it hands over the whole library and lets the Art Director choose.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/collect-references.js"]},{"id":"prior-attempts","label":"write-prior-attempts.js","kind":"script","what":"Leaves `signals/prior-attempts.json`: what earlier failed attempts of the same night spent, so the run prices itself against the whole night.","when":"Step in [[redesign-job]] before the pipeline; reads `pipeline-failure` issues through `gh`.","how":"Never fails the run. Bad input or a failed `gh` means no earlier attempts.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/write-prior-attempts.js"]},{"id":"resume-steps","label":"Resume steps","kind":"script","what":"Four conditional steps that stage a failed run's `handoff.json` for the pipeline.","when":"Only on `workflow_dispatch` with `resume_run_id` set.","how":"Checks the id is digits, downloads `build-failed-<id>` with `actions/download-artifact`, finds `handoff.json`, copies it to `signals/resume-handoff.json`. No handoff means the failed run died before its first paid answer, and the job errors out.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml"]},{"id":"daily-redesign-js","label":"daily-redesign.js","kind":"script","what":"Outer orchestration: checks the `claude` CLI exists, reads site context, loads a resume if `RESUME_HANDOFF` is set, calls [[design-agents-js]], and publishes the run date to `GITHUB_OUTPUT`.","when":"The `Run daily redesign` step, with `ANTHROPIC_API_KEY`, `DRY_RUN`, `SHIP_GATE=lenient` and `RESUME_HANDOFF`.","how":"Exit 1 on any swarm error. `DRY_RUN=true` only changes the closing log line; it does not skip a model call or the archive. The date output is the Eastern day, so the later push steps use the same key.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/daily-redesign.js"]},{"id":"design-agents-js","label":"design-agents.js","kind":"script","what":"`runAgentSwarm`: runs seven phases in order through `runPhase`, which prints `[phase]` lines: context, art-director, mockup, engineer, build, gate, archive.","when":"Called by [[daily-redesign-js]]; also by `scripts/run-pipeline.js` and the canary.","how":"Resets the [[cost-ledger]], starts the [[call-tape]], builds run state with a deadline. On a throw it rolls the checkout back; in `finally` it saves the trace ([[failure-artifact]] on failure).","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/design-agents.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-events.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/run-state.js"]},{"id":"context-phase","label":"Context phase","kind":"script","what":"Loads the prompts, references, a backup of yesterday's files, archive history and the mandates the later agents read.","when":"First phase of [[design-agents-js]].","how":"Builds the recent-ratings block, the permanent [[taste-md]], the owner's `voice.md`, and the mobile record of recent nights. Signals are wrapped as data with a per-run boundary id (`data-boundary.js`).","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/context.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/ratings.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/data-boundary.js"]},{"id":"models-tiers","label":"Model tiers","kind":"script","what":"Resolves each agent to an explicit model ID. Prod: Art Director and Mockup Designer on `claude-opus-4-8`; Mockup Critic and React Engineer on `claude-opus-5-5`; Screenshot Critic on `claude-sonnet-5`.","when":"Every model call. `PIPELINE_TIER=dev|prod` overrides; with no override an `ANTHROPIC_API_KEY` means prod and no key means dev.","how":"Dev caps every agent at `claude-sonnet-5` to spare the Max-plan Opus budget. `MODEL_OVERRIDE=agent=tier,...` swaps one agent for a run. Per-agent timeouts in `budgets.js`: 25 min Art Director, 30 min designer and engineer, 10 min critics.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/models.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/budgets.js"]},{"id":"run-budget","label":"Run deadline","kind":"hook","what":"A wall-clock deadline (`RUN_BUDGET_MINUTES`, default 60) registered once and applied to every model call.","when":"From run state creation to the end.","how":"`pastDeadline()` stops new mockup rounds, repair attempts and extra revision rounds, and each call's timeout is clamped to what is left so the 80-minute job timeout never kills a call mid-flight.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/run-budget.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/run-state.js"]},{"id":"call-tape","label":"Call tape","kind":"script","what":"Records the raw text of every paid response before the engineer (Art Director and mockup loop), per agent in order.","when":"During the first two stages of every run; replayed on a resume.","how":"On a resume the same parsers and validators run on the taped text, so there is one code path. The engineer and screenshot critic are never taped. A tape that runs out falls through to the live call.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/call-tape.js"]},{"id":"cost-ledger","label":"Cost ledger","kind":"script","what":"Per-run accounting of spend. Each call is a record with agent, model, tokens, cost and a purpose (first, retry, block-retry, revision, repair, output-patch, rejudge, replay).","when":"Appended on every model call through the CLI or SDK path; reset at the top of a run.","how":"Cost is the CLI's `total_cost_usd` when reported, otherwise priced from the model catalog and flagged `estimated`. Replayed tape entries cost nothing. Written out as [[cost-json]].","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/cost-ledger.js"]},{"id":"mock-mode","label":"MOCK_MODE fixtures","kind":"script","what":"Replays recorded agent responses at the CLI seam so the whole swarm runs without model calls.","when":"`MOCK_MODE=true`, used by tests and `pnpm canary --mock`. `FIXTURE_DIR` picks the corpus (`fixtures/agents/` or `fixtures/canary/`).","how":"Fixtures are indexed per agent per process, so a second engineer call replays its own response. Parsers, validators, gates and archive writes all run for real.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/agent-fixtures.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/canary.js"]},{"id":"canary","label":"canary.js","kind":"script","what":"A local rehearsal of the pipeline that writes evidence under `docs/evidence/canary/`.","when":"Run by hand; `--mock` forces `MOCK_MODE=true DRY_RUN=true`, otherwise a real run with `DRY_RUN=true`.","how":"Not part of the nightly. Prints the `pnpm taste` command to record a reaction in `signals/taste.md`.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/canary.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/taste-note.js"]},{"id":"art-director","label":"Art Director","kind":"lane","sublabel":"Opus 4.8","what":"One decision: hero copy, composition tuple, typography chassis, the full `elements/preset.ts`, and the visual spec blocks (measurables, shell, header, composition, mobile, type treatment, motion). Replaced an older director + spec critic + token designer trio.","when":"Phase 2 of the swarm, after [[context-phase]].","how":"Model `claude-opus-4-8`. A rejected reply gets a block retry (only the failed blocks, spliced back by `ad-block-splice.js`), then one full retry with the error. A hero phrase used in the last 30 days is rejected the same way by the [[hero-repeat-check]]. A codegen failure asks it once more.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/agents/art-director.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-art-director.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/prompts/art-director.md"]},{"id":"hero-repeat-check","label":"Fresh-hero check","kind":"hook","what":"Rejects a hero phrase that repeats a night from the last 30 days, or contains or is contained in one of four words or more.","when":"After the Art Director's first valid reply, and again after a codegen retry (spec 11, 1b).","how":"Ask for a new phrase as a block retry, then a full retry. If that also repeats, the whole Art Director runs once more.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/hero-repeat.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-art-director.js"]},{"id":"orchestrator-codegen","label":"Chassis codegen","kind":"script","what":"Writes the files no model authors: `__root.tsx` from a frozen template with the chassis's Google Fonts URL, `elements/chassis-preset.ts`, and the brand lockup, site callout, material and white-paper components.","when":"Right after the Art Director settles, from the chassis it chose out of `elements/chassis/*.js`.","how":"Pure transforms in `chassis.js` (font tokens, step table, spacing). Then `pnpm panda codegen`, which regenerates `styled-system/` from the preset. Engineer output that names these files is dropped.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/chassis.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-art-director.js","https://github.com/marchdoe/dougmar.ch/blob/main/elements/chassis/index.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/templates/__root.tsx.template"]},{"id":"mockup-designer","label":"Mockup Designer","kind":"lane","sublabel":"Opus 4.8","what":"Writes one self-contained `signals/today.mockup.html` for the day's design. A revision is a patch to the previous page, not a regeneration.","when":"Phase 3, round 0 and up to two revision rounds.","how":"Model `claude-opus-4-8`. System prompt is assembled with a size cap and a lane from `selectLane` (17 lanes, biased by the composition tuple, steered away from the last 3 builds). Also gets the lessons block (last 7 critic findings). A crashed revision keeps the earlier mockup.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/agents/mockup-designer.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-mockup.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/select-lane.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/lessons.js"]},{"id":"mockup-precheck","label":"Mockup pre-check","kind":"hook","what":"Measures in code what the critic used to estimate: canvas, colour and hero scale against the Art Director's declarations, mark size, and the pixel-contrast probe on text.","when":"Each mockup round, after the screenshot at 1440 and phone width and before the critic.","how":"Findings carry a check number, key, gap and instruction. Recorded as a `mockup-precheck` verdict (REVISE or APPROVE). A fault whose gap shrank under 25% since the last round counts as no progress and ends the loop.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/mockup-precheck.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/pixel-contrast.js"]},{"id":"mockup-critic","label":"Mockup Critic","kind":"lane","sublabel":"Opus 5.5","what":"A blocking vision judge over the mockup screenshot. Judges freshness, legibility, hierarchy, the hero in the first fold at 1440 and 360, copy against the work records, and header, footer and ground declarations.","when":"Each mockup round, after [[mockup-precheck]].","how":"Model `claude-opus-5-5`. Verdict APPROVE or REVISE; a malformed reply fails closed to REVISE but with no feedback, so it does not buy another designer round. At most 2 revisions (3 designer calls). If never approved, `settleMockupRound` ships the round with the smallest measured shortfall.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/agents/mockup-critic.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-mockup.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/prompts/mockup-critic.md"]},{"id":"react-engineer","label":"React Engineer","kind":"lane","sublabel":"Opus 5.5","what":"Translates the approved mockup into the production TSX files (Layout, Sidebar, routes, components) using Panda CSS and the day's tokens.","when":"Phase 4, after the mockup settles.","how":"Model `claude-opus-5-5`, effort `high` (a trial since 2026-09-22 after Sonnet 5 started at 37 gate errors against 4). One retry on a stall. A reply that is incomplete or breaks the declared shell posture is repaired by a patch, not asked for again in full. Unused generated components are swept.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-engineer.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/prompts/react-engineer.md","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/models.js"]},{"id":"engineer-repair","label":"Build repair","kind":"lane","sublabel":"Opus 5.5","what":"The React Engineer answering a failed build with a patch over the files it owns.","when":"When [[build-gate]] fails; up to 3 attempts, stopping early when the deadline passes.","how":"Same model as the engineer, prompt `react-engineer-repair.md`. A failure that names only `elements/preset.ts` gets no attempts, since the engineer cannot see or edit that file, and the run fails with the reason. A repair agent crash ends the run with the real error.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-build.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/prompts/react-engineer-repair.md"]},{"id":"engineer-revision","label":"Critic revision","kind":"lane","sublabel":"Opus 5.5","what":"The React Engineer revising a passing build against the surface gate's measured faults and the screenshot critic's notes.","when":"Inside the [[gate-phase]], after [[surface-gate]] round 1 and the first [[screenshot-critic]] verdict.","how":"Up to 3 rounds. A fourth is granted when the third leaves 1 or 2 engineer-owned faults that are all new since the round before. Each round is a patch, then a rebuild, then a re-measure. A revision that breaks the build restores the last passing snapshot and proves it rebuilds.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/revision-rounds.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/engineer-tools.js"]},{"id":"screenshot-critic","label":"Screenshot Critic","kind":"lane","sublabel":"Sonnet 5","what":"A vision judge over the built site: mockup, 1440 light and dark, phone and tablet stills, header crops, filmstrips of /about and a case study, and a calibration reference. Up to 9 images.","when":"Once on the first passing build and once more after the revisions (purpose `rejudge`).","how":"Model `claude-sonnet-5`. Verdict SHIP or REVISE; UNVERIFIED when the reply was truncated, text-only or the call failed, which gets no vote. Any REVISE routes to the React Engineer whatever agent it names. Non-blocking if it cannot run.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/agents/screenshot-critic.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/screenshot-judge.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/prompts/screenshot-critic.md"]},{"id":"build-gate","label":"Build gate","kind":"hook","what":"`validateBuild`: pre-build validation of generated files, `pnpm build`, build-output smoke checks, and the [[static-checks]], all run and reported together.","when":"Phase 5 after the engineer, and after every repair or revision.","how":"Every gate that can run does, so one repair sees all the failures. Smoke checks are skipped if the build made no output. Build timeout 120 seconds. Output goes to `archive/<date>/last-build-output.txt`.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/build-validator.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-build.js"]},{"id":"static-checks","label":"Static checks","kind":"hook","what":"`biome check --write` on generated paths, `tsc --noEmit`, and `fallow audit --base HEAD`.","when":"Inside [[build-gate]].","how":"Biome auto-fixes what it can; remaining lint or any tsc error fails the gate, and fallow is run against HEAD. Output is written to `archive/<date>/last-static-checks.txt`, which the failure artifact carries.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/build-validator.js"]},{"id":"surface-gate","label":"Surface gate","kind":"hook","what":"Measures every generated route at 3 widths (360x640, 820x1180, 1440x900) in light and dark, with no model tokens.","when":"Round 1 before the screenshot critic; again after each revision that rebuilt.","how":"Finding kinds include unreachable, status, overflow, running-copy, clipped, console errors, shell-overlap, og-fit, brand-fold, brand-contrast, nav-reach, heading, hero-fold, plus mockup drift. Tap targets at 360 are warnings. An error on a surface the engineer owns forces a revision whatever the critic says. Errors on hand-written routes become a `NEEDS-HUMAN` verdict. If the gate itself throws it records that and does not block.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/surface-gate.js","https://github.com/marchdoe/dougmar.ch/blob/main/elements/chassis/viewports.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-gate.js"]},{"id":"copy-gate","label":"Copy gate","kind":"hook","what":"A deterministic read of the words: AI-tell phrases in the engineer's string literals and JSX, and in rendered `innerText`, plus orphan separators like \", iCapital\".","when":"Runs inside each [[surface-gate]] round.","how":"Findings (`copy-tell`) join the surface findings and reach the engineer. `data-allow-copy-tell` exempts an element; a quoted hero line with a named author may keep its em dash. Hand-written content is reported as warnings for a human.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/copy-gate.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/copy-tells.js"]},{"id":"legibility-probe","label":"Legibility probe","kind":"hook","what":"Renders each hard-ground text with its glyphs transparent and checks every pixel row through the line against WCAG AA (4.5:1, or 3:1 for large text).","when":"Inside [[surface-gate]] and [[mockup-precheck]].","how":"A line fails when any row is under the floor across a set fraction of its width. This is the one fault `SHIP_GATE=lenient` does not wave through.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/pixel-contrast.js"]},{"id":"mockup-drift-gate","label":"Mockup drift gate","kind":"hook","what":"Compares the build to the approved mockup. Two faults are raised to errors on `/` at 1440: the largest text is a different text (`mockup-hierarchy`), or a top-3 text is under half or over twice its mockup size (`mockup-scale`).","when":"Each [[surface-gate]] round.","how":"They force revisions but never block the ship and never earn the extra round. What survives ships as a `DRIFTED` verdict listed in the [[rating-issue]].","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/mockup-drift-gate.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/mockup-advisory.js"]},{"id":"gate-phase","label":"Gate phase","kind":"script","what":"Snapshots the passing build, then runs surface gate, screenshot critic, revisions, final re-judge and the ship decision.","when":"Phase 6 of [[design-agents-js]], after the build passes.","how":"`snapshotPassingState` first, so a broken revision restores today's files, not yesterday's. Then [[surface-gate]], [[screenshot-critic]], [[engineer-revision]] rounds, then [[ship-gate]].","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-gate.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/revision-rounds.js"]},{"id":"ship-gate","label":"Ship gate","kind":"hook","what":"Refuses a build that still has engineer-owned faults after the revisions.","when":"End of [[gate-phase]], before the archive.","how":"Faults are counted after dropping drift. Under `SHIP_GATE=lenient` (set in the workflow since #633) the build ships with a `SHIPPED-WITH-FAULTS` verdict, unless a legibility fault remains. Otherwise it archives the sources to `build-failed-sources-*` and throws. If the last round measured nothing it ships unmeasured, and the render gate is the backstop.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-gate.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/pixel-contrast.js"]},{"id":"archive-phase","label":"Archive phase","kind":"script","what":"Captures the `/og` share card to `public/og/<date>.png`, writes `archetype.txt`, and archives the build with every artifact the run collected.","when":"Last phase of the swarm, after [[ship-gate]].","how":"`archive()` writes `brief.md`, `build.json`, [[cost-json]], a copy of `preset.ts`, `screenshot.png`, [[verdicts-json]], phone/tablet captures under `viewports/`, `responsive-metrics.json` and `record.json`, copies the site HTML to `public/archive/<date>/`, then reseals every archived page. The og capture is best-effort.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-archive.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/archiver.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/archive-record.js"]},{"id":"archive-seal","label":"Archive seal","kind":"script","what":"Rewrites links in archived pages that would walk a visitor onto the live site and injects the archive frame.","when":"Each night at the end of `archive()`, over the whole archive (idempotent).","how":"A sealed page runs no script. The live site's rail (marked `data-live-frame`) is cut out first. Non-blocking.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/seal-archive.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/archive-seal.js"]},{"id":"render-gate","label":"Render gate","kind":"hook","what":"`pnpm test` then `pnpm test:e2e:site` against the night just built, with `NIGHTLY_RUN=1`.","when":"The `Verify the night's output renders` step in [[redesign-job]]; skipped on a dry run.","how":"Playwright runs [[site-health-spec]]. Any failure fails the job, which routes to [[notify-job]] and leaves a [[failure-artifact]] with the handoff for a resume.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml","https://github.com/marchdoe/dougmar.ch/blob/main/tests/e2e/site-health.spec.ts"]},{"id":"site-health-spec","label":"site-health.spec.ts","kind":"script","what":"The e2e file: core and project pages load with status under 500 and real content, the white paper on `/work/dougmar-ch`, archive calendar, explainer and frame, the live rail, the home callout, share-sheet meta, inline script pinning, navigation, and `/elements` against the preset.","when":"Run by [[render-gate]] and by [[ci-wf]].","how":"Under `NIGHTLY_RUN=1` three probes are skipped because the surface gate already measured them during the night: invisible text, words broken across lines, and the reveal not being load-bearing. PR CI runs them against the committed design.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/tests/e2e/site-health.spec.ts"]},{"id":"signals-today","label":"signals/today.yml","kind":"board","what":"The day's signal values (weather, news, market, quote and the rest), with `today.meta.yml` for provider status.","when":"Written by [[collect-signals]]; read by the Art Director and, on a resume, restored from the handoff.","how":"The date inside it is the Eastern day every archive path is keyed on. The quote signal is a random draw, which is why a resume restores the file rather than re-collecting.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/collect-signals.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/handoff.js"]},{"id":"references-md","label":"signals/today.references.md","kind":"board","what":"The curated design references for the night.","when":"Written by [[collect-references]]; staged and pushed with the night.","how":"Restored from the handoff on a resume.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/collect-references.js","https://github.com/marchdoe/dougmar.ch/blob/main/.github/workflows/daily-redesign.yml"]},{"id":"taste-md","label":"signals/taste.md","kind":"board","what":"The owner's hand-kept, all-time taste memory, plus a section of local canary notes.","when":"Read in the [[context-phase]] and fed to the Art Director and Mockup Designer.","how":"Unlike the 10-build ratings window, nothing prunes it. `pnpm taste` appends to it.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/context.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/taste-note.js"]},{"id":"rating-json","label":"archive/<date>/rating-<ts>.json","kind":"board","what":"One harvested rating: date, grade, worked, didnt, try, timestamp.","when":"Written by [[collect-ratings]]; staged by the workflow with `archive/*/rating-*.json`.","how":"Recent ratings feed the Art Director prompt through `buildRecentRatingsBlock`.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/collect-ratings.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/ratings.js"]},{"id":"preset-ts","label":"elements/preset.ts","kind":"board","what":"The Art Director's Panda preset: the day's palette and semantic colours.","when":"Written by the Art Director phase; read by the mockup phase and the engineer.","how":"Only the Art Director owns it. The engineer's repair brief leaves it out. Copied into the build archive.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/elements/preset.ts","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/engineer-tools.js"]},{"id":"chassis-preset-ts","label":"elements/chassis-preset.ts","kind":"board","what":"Font, size, line-height, tracking and spacing tokens from the chosen typography chassis.","when":"Written by the orchestrator, never a model, in [[orchestrator-codegen]].","how":"One of the chassis in `elements/chassis/*.js` (15 files, such as `fraunces-karla` and `space-mono-archivo`).","source":["https://github.com/marchdoe/dougmar.ch/blob/main/elements/chassis-preset.ts","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/chassis.js"]},{"id":"mockup-html","label":"signals/today.mockup.html","kind":"board","what":"The settled mockup page. It never enters the build.","when":"Written each round by [[mockup-designer]].","how":"The engineer receives it, with interior notes, as the thing to translate.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/phase-mockup.js"]},{"id":"generated-app","label":"app/components, app/routes","kind":"board","what":"The engineer's TSX for the night, plus `__root.tsx` from the template.","when":"Written by [[react-engineer]], patched by repairs and revisions.","how":"Hand-written routes (`/work`, `/experiments`) and `app/content/*` are outside the engineer's reach; the [[live-rail]] is rendered by `__root.tsx` outside `Layout`.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/pipeline/engineer-tools.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/site-context.js"]},{"id":"archive-dir","label":"archive/<date>/build-N","kind":"board","what":"The night's permanent record: brief, signals brief, preset copy, screenshot, viewports, metrics, [[verdicts-json]], [[cost-json]], and `record.json`.","when":"Written by [[archive-phase]]; committed by [[publish-job]].","how":"`record.json` on main is what [[backstop-script]] reads to decide a night exists.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/archiver.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/archive-record.js"]},{"id":"public-archive","label":"public/archive/<date>","kind":"board","what":"Static, sealed HTML of the day's site, plus the `public/og/<date>.png` card.","when":"Written by [[archive-phase]]; sealed by [[archive-seal]].","how":"Served at its own URL. Screenshots are copied out of `archive/` at build time, not committed twice.","source":["https://github.com/marchdoe/dougmar.ch/blob/main/scripts/utils/archiver.js","https://github.com/marchdoe/dougmar.ch/blob/main/scripts/generate-archive-json.js"]},{"id":"verdicts-json","label":"verdicts.json","kind":"board","what":"Every verdict the night produced: pre-check, mockup critic, surface gate, screenshot critic, ship gate.","when":"Collected in run state; written to the b
